  `;
  el('go-dash').addEventListener('click', () => {
    state.route = 'dashboard';
    renderShell();
    renderRoute();
  });
  attachTournamentPicker();
}

// ============================================================
// SPECTATOR MODE
// ============================================================
function renderSpectatorShell() {
  el('app').innerHTML = `
    <div style="min-height:100vh;">
      <div id="spec-root"></div>
    </div>
  `;
}

function renderSpectator() {
  const root = el('spec-root') || el('app');
  const t = state.activeTournament;
  if (!t) {
    root.innerHTML = `
      <div class="card" style="max-width:500px; margin:80px auto;">
        <div class="empty-state">
          <h3>Tournament not found</h3>
          <p class="muted">This tournament may have been deleted or the link is incorrect.</p>
        </div>
      </div>
    `;
    return;
  }

  const activeRound = state.rounds.find(r => r.status === 'active');
  const latestRound = state.rounds[state.rounds.length - 1];
  const display = activeRound || latestRound;

  root.innerHTML = `
    <div class="spectator-header">
      <h1>${esc(t.name)}</h1>
      <div class="meta">
        ${esc(t.format.toUpperCase())} ·
        ${display ? `Round ${display.round_number}` : 'Not started'} ·
        <span class="badge ${t.status === 'running' ? 'gold' : t.status === 'complete' ? 'green' : 'muted'}">${esc(t.status)}</span>
      </div>
      <div class="spectator-tabs">
        <div class="spectator-tab ${state.specRoute === 'standings' ? 'active' : ''}" data-spec="standings">Standings</div>
        <div class="spectator-tab ${state.specRoute === 'pairings' ? 'active' : ''}" data-spec="pairings">Pairings</div>
        <div class="spectator-tab ${state.specRoute === 'bracket' ? 'active' : ''}" data-spec="bracket">Bracket</div>
        ${state.decks.some(d => d.revealed) ? `
          <div class="spectator-tab ${state.specRoute === 'decks' ? 'active' : ''}" data-spec="decks">Decks</div>
        ` : ''}
      </div>
      <div style="font-size:0.75rem; color:var(--muted); margin-top:4px;">
        <span class="live-dot"></span>Live · Last updated ${state.lastUpdated ? state.lastUpdated.toLocaleTimeString() : '—'}
      </div>
    </div>
    <div style="max-width:900px; margin:0 auto; padding:0 16px 60px;" id="spec-body"></div>
  `;

  document.querySelectorAll('[data-spec]').forEach(tab => {
    tab.addEventListener('click', () => {
      state.specRoute = tab.dataset.spec;
      renderSpectator();
    });
  });

  const body = el('spec-body');
  switch (state.specRoute) {
    case 'standings': renderSpecStandings(body); break;
    case 'pairings': renderSpecPairings(body, display); break;
    case 'bracket': renderSpecBracket(body); break;
    case 'decks': renderSpecDecks(body); break;
  }
}

function renderSpecDecks(body) {
  const revealed = state.decks.filter(d => d.revealed && (d.cards || []).length > 0);
  if (revealed.length === 0) {
    body.innerHTML = `<div class="card"><div class="empty-state"><h3>No decks revealed yet</h3><p>The organizer can reveal decks after the tournament.</p></div></div>`;
    return;
  }
  body.innerHTML = `
    ${revealed.map(d => {
      const p = state.players.find(x => x.id === d.player_id);
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${esc(p?.name || 'Unknown')}${d.deck_name ? ` · <span class="muted" style="font-size:0.78rem;">${esc(d.deck_name)}</span>` : ''}</div>
          </div>
          ${renderDeckPreview(d.cards, { curve: false })}
        </div>
      `;
    }).join('')}
  `;
}

function renderSpecStandings(body) {
  const standings = computeStandings();
  if (standings.length === 0) {
    body.innerHTML = `<div class="card"><div class="empty-state"><h3>No results yet</h3><p>Check back after the first round.</p></div></div>`;
    return;
  }
  body.innerHTML = `
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Player</th><th>Record</th><th>Pts</th><th>Cube Δ</th><th>OMW%</th></tr></thead>
        <tbody>
          ${standings.map(s => `
            <tr>
              <td class="rank-${s.rank <= 3 ? s.rank : ''}"><strong>${s.rank}</strong></td>
              <td>
                <strong>${esc(s.player.name)}</strong>
                ${s.player.alias ? `<span class="muted"> · ${esc(s.player.alias)}</span>` : ''}
                ${s.player.dropped ? ' <span class="badge red">dropped</span>' : ''}
              </td>
              <td>${s.wins}-${s.losses}${s.draws ? '-' + s.draws : ''}</td>
              <td>${s.matchPoints}</td>
              <td>${fmtCubeDiff(s.cubeDiff)}</td>
              <td>${fmtPct(s.omwp)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table></div>
    </div>
  `;
}

function renderSpecPairings(body, round) {
  if (!round) {
    body.innerHTML = `<div class="card"><div class="empty-state"><h3>No active round</h3></div></div>`;
    return;
  }
  const pairings = state.pairings.filter(p => p.round_id === round.id)
    .sort((a, b) => (a.table_number || 0) - (b.table_number || 0));
  body.innerHTML = `
    <div class="row-between" style="margin-bottom:16px;">
      <h2 style="margin:0;">Round ${round.round_number}</h2>
      <span class="badge ${round.status === 'active' ? 'gold' : 'green'}">${esc(round.status)}</span>
    </div>
    ${pairings.map(p => {
      const p1 = state.players.find(x => x.id === p.player1_id);
      const p2 = state.players.find(x => x.id === p.player2_id);
      const r = p.result || {};
      const done = !!r.winner;
      if (p.is_bye) {
        return `
          <div class="pairing bye">
            <div class="table-num">T${p.table_number || '-'}</div>
            <div class="pairing-players">
              <div class="pairing-player"><div class="name">${esc(p1?.name || '—')}</div></div>
              <div class="pairing-vs">BYE</div>
              <div class="pairing-player right"><div class="name dim">—</div></div>
            </div>
            <div><span class="badge gold">BYE</span></div>
          </div>
        `;
      }
      return `
        <div class="pairing ${done ? 'complete' : 'pending'}">
          <div class="table-num">T${p.table_number || '-'}</div>
          <div class="pairing-players">
            <div class="pairing-player">
              <div class="name">${esc(p1?.name || 'TBD')}</div>
            </div>
            <div class="pairing-vs">VS</div>
            <div class="pairing-player right">
              <div class="name">${esc(p2?.name || 'TBD')}</div>
            </div>
          </div>
          <div>
            ${done && round.status === 'finalized' ? `
              <div style="text-align:right;">
                <div style="font-family:'Bebas Neue',sans-serif; font-size:1.3rem; color:var(--gold);">
                  ${r.cubes1 ?? 0} — ${r.cubes2 ?? 0}
                </div>
                <div style="font-size:0.72rem; color:var(--muted);">
                  ${r.winner === 'draw' ? 'DRAW' : esc(r.winner === 'player1' ? p1?.name : p2?.name) + ' WINS'}
                </div>
              </div>
            ` : done ? `<span class="badge green">Reported</span>` : `<span class="badge gold">Playing</span>`}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function renderSpecBracket(body) {
  const elimRounds = state.rounds.filter(r =>
    state.pairings.some(p => p.round_id === r.id && p.bracket_stage)
  ).sort((a, b) => a.round_number - b.round_number);

  if (elimRounds.length === 0) {
    body.innerHTML = `<div class="card"><div class="empty-state"><h3>Bracket not started</h3><p>Swiss rounds must complete first.</p></div></div>`;
    return;
  }

  body.innerHTML = `
    <div class="card">
      <div class="bracket">
        ${elimRounds.map(r => {
          const ps = state.pairings.filter(p => p.round_id === r.id);
          const stage = ps[0]?.bracket_stage || `R${r.round_number}`;
          return `
            <div class="bracket-round">
              <div class="bracket-round-label">${esc(stage)}</div>
              ${ps.map(p => {
                const p1 = state.players.find(x => x.id === p.player1_id);
                const p2 = state.players.find(x => x.id === p.player2_id);
                const rr = p.result || {};
                return `
                  <div class="bracket-match ${rr.winner ? 'complete' : ''}">
                    <div class="bracket-slot ${rr.winner === 'player1' ? 'winner' : ''} ${!p1 ? 'empty' : ''}">
                      <span>${esc(p1?.name || 'TBD')}</span>
                      <strong>${rr.cubes1 ?? ''}</strong>
                    </div>
                    <div class="bracket-slot ${rr.winner === 'player2' ? 'winner' : ''} ${!p2 ? 'empty' : ''}">
                      <span>${esc(p2?.name || (p.is_bye ? 'BYE' : 'TBD'))}</span>
                      <strong>${rr.cubes2 ?? ''}</strong>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// ============================================================
// REAL-TIME SUBSCRIPTIONS (Spectator)
// ============================================================
function subscribeRealtime(tournamentId) {
  if (!state.supabase) return;
  if (state.realtimeChannel) {
    state.supabase.removeChannel(state.realtimeChannel);
  }

  const channel = state.supabase.channel(`tourney-${tournamentId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments', filter: `id=eq.${tournamentId}` }, async () => {
      await loadTournamentData(tournamentId);
      renderSpectator();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `tournament_id=eq.${tournamentId}` }, async () => {
      await loadTournamentData(tournamentId);
      renderSpectator();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rounds', filter: `tournament_id=eq.${tournamentId}` }, async () => {
      await loadTournamentData(tournamentId);
      renderSpectator();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pairings' }, async () => {
      await loadTournamentData(tournamentId);
      renderSpectator();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'decks', filter: `tournament_id=eq.${tournamentId}` }, async () => {
      await loadTournamentData(tournamentId);
      renderSpectator();
    })
    .subscribe();

  state.realtimeChannel = channel;

  // Also poll every 30s as backup
  setInterval(async () => {
    await loadTournamentData(tournamentId);
    renderSpectator();
  }, 30000);
}

// ============================================================
// BOOT
// ============================================================
async function boot() {
  parseRoute();

  // Supabase connect
  if (!state.supabase) {
    if (!initSupabase()) {
      if (state.mode === 'spectator' || state.mode === 'register') {
        el('app').innerHTML = `<div class="card" style="max-width:500px;margin:80px auto;">
          <div class="empty-state">
            <h3>Link inactive</h3>
            <p>The organizer hasn't configured this instance yet.</p>
          </div>
        </div>`;
        return;
      }
      return renderSetup();
    }
  }

  if (state.mode === 'spectator') {
    renderSpectatorShell();
    try {
      await Promise.all([
        loadTournamentData(state.activeTournamentId),
        loadCards(),
      ]);
    } catch (err) {
      console.error(err);
    }
    renderSpectator();
    subscribeRealtime(state.activeTournamentId);
    return;
  }

  if (state.mode === 'register') {
    renderRegistrationShell();
    try {
      await Promise.all([
        loadTournamentData(state.activeTournamentId),
        loadCards(),
      ]);
    } catch (err) {
      console.error(err);
    }
    renderRegistrationView();
    return;
  }

  // TO mode: check PIN
  const hasPin = !!localStorage.getItem(LS_KEYS.PIN_HASH);
  const authed = sessionStorage.getItem(LS_KEYS.AUTHED) === '1';
  if (!authed) {
    return renderPinGate();
  }
  state.authed = true;

  // Load tournaments and most recent active
  await Promise.all([loadTournaments(), loadCards()]);
  const saved = localStorage.getItem(LS_KEYS.ACTIVE_TOURNAMENT);
  if (saved && state.tournaments.find(t => t.id === saved)) {
    state.activeTournamentId = saved;
  } else if (state.tournaments.length > 0) {
    state.activeTournamentId = state.tournaments[0].id;
    localStorage.setItem(LS_KEYS.ACTIVE_TOURNAMENT, state.activeTournamentId);
  }
  if (state.activeTournamentId) {
    await loadTournamentData(state.activeTournamentId);
  }

  renderShell();
  renderRoute();
}

// Kickoff
boot().catch(err => {
  console.error('Boot error', err);
  toast('Startup error — check console', 'error');
});

</script>
</body>
</html>
