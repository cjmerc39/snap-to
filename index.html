<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snap TO — Marvel Snap Tournament Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   SNAP TO — SLEEK PREMIUM CARD-SHOP AESTHETIC
   Dark navy base · prismatic/chromatic accents · hex cost gems ·
   glowing rarity borders · chunky numerics · sleek restraint.
   ============================================================ */

:root {
  /* Deep navy base — Snap's card-shop backdrop */
  --bg:          #0A0E1F;
  --bg-1:        #0D1228;
  --bg-2:        #111737;
  --panel:       #151B3A;
  --panel-hi:    #1C244A;
  --panel-lo:    #0F1430;
  --line:        rgba(180, 200, 255, 0.08);
  --line-hi:     rgba(180, 200, 255, 0.16);
  --line-glow:   rgba(140, 170, 255, 0.28);

  /* Text */
  --text:        #EEF2FF;
  --text-dim:    #A9B2D4;
  --muted:       #737CA0;
  --dim:         #4A5179;

  /* Snap signature palette — card rarity gems */
  --ink:         #1FE3FF;   /* INK cyan — common glow */
  --bronze:      #E08A4B;   /* BRONZE variant */
  --silver:      #C6CEE2;   /* SILVER variant */
  --gold:        #FFC845;   /* GOLD variant */
  --gold-hi:     #FFDD7A;
  --gold-lo:     #9B7418;
  --prism-1:     #FF5BB5;   /* PRISM magenta */
  --prism-2:     #7B5BFF;   /* PRISM violet */
  --prism-3:     #3DB2FF;   /* PRISM cyan */
  --ember:       #FF4D55;   /* action red */
  --ember-hi:    #FF7079;
  --ember-lo:    #7F1418;
  --jade:        #3BE3A0;   /* success */

  /* Geometry — Snap uses strong roundedness */
  --r-sm: 6px;
  --r:    12px;
  --r-lg: 16px;
  --r-xl: 22px;

  /* Shadows & glows */
  --shadow-1: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 28px rgba(5,8,20,0.55);
  --shadow-2: 0 1px 0 rgba(255,255,255,0.05) inset, 0 24px 64px rgba(5,8,20,0.75);
  --glow-gold:   0 0 0 1px rgba(255,200,69,0.4), 0 0 24px rgba(255,200,69,0.28);
  --glow-prism:  0 0 0 1px rgba(123,91,255,0.45), 0 0 28px rgba(123,91,255,0.3), 0 0 48px rgba(255,91,181,0.18);
  --glow-ember:  0 0 0 1px rgba(255,77,85,0.4), 0 0 24px rgba(255,77,85,0.28);
  --glow-ink:    0 0 0 1px rgba(31,227,255,0.4), 0 0 24px rgba(31,227,255,0.28);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv11", "ss01", "tnum";
}

body {
  min-height: 100vh;
  background:
    /* faint starfield */
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 75% 60%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.3), transparent),
    /* nebula color pools */
    radial-gradient(900px 500px at 10% -5%, rgba(123,91,255,0.14), transparent 60%),
    radial-gradient(800px 500px at 105% 5%, rgba(61,178,255,0.10), transparent 60%),
    radial-gradient(900px 600px at 50% 115%, rgba(255,91,181,0.08), transparent 60%),
    linear-gradient(180deg, #0A0E1F 0%, #070A18 100%);
  background-attachment: fixed;
}

/* ============================================================ TYPE ============================================================ */
h1, h2, h3, h4, h5 {
  font-family: 'Barlow Condensed', 'Inter', sans-serif;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.05;
  color: var(--text);
  text-transform: uppercase;
}
h1 { font-size: 2.3rem; letter-spacing: 0.005em; }
h2 { font-size: 1.65rem; }
h3 { font-size: 1.25rem; }
h4 {
  font-size: 0.72rem;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.display {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

/* Chunky number overlay — scores, ranks, table nums */
.chunk-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-style: italic;
  letter-spacing: -0.01em;
  -webkit-text-stroke: 1px rgba(0,0,0,0.4);
  text-shadow:
    0 2px 0 rgba(0,0,0,0.3),
    0 4px 14px rgba(123,91,255,0.35);
}

code, .mono {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 0.86em;
  color: var(--ink);
}

a { color: var(--ink); text-decoration: none; transition: color 0.12s; }
a:hover { color: #8BEEFF; }

/* ============================================================ APP SHELL ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: 258px 1fr;
  min-height: 100vh;
}

.sidebar {
  background:
    linear-gradient(180deg, rgba(123,91,255,0.06) 0%, transparent 35%),
    var(--bg-1);
  border-right: 1px solid var(--line);
  padding: 22px 0 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
.sidebar::before {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--prism-2) 30%, var(--prism-1) 70%, transparent);
  opacity: 0.55;
}

.brand {
  padding: 2px 22px 22px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.brand-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1;
}
.brand-title .mark {
  /* Hex cost-gem shape as the brand mark */
  display: inline-block;
  width: 22px; height: 22px;
  background: linear-gradient(135deg, var(--prism-1), var(--prism-2) 50%, var(--prism-3));
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  box-shadow: 0 0 14px rgba(123,91,255,0.55);
  position: relative;
}
.brand-title .mark::after {
  content: '';
  position: absolute;
  inset: 2px;
  background: linear-gradient(160deg, rgba(255,255,255,0.3), transparent 45%);
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
}
.brand-title .accent {
  background: linear-gradient(135deg, var(--prism-1), var(--prism-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-sub {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.24em;
  color: var(--muted);
  margin-top: 6px;
  font-weight: 600;
}

.nav { flex: 1; padding: 0 10px; }
.nav-section-label {
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 14px 14px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  margin: 2px 0;
  color: var(--text-dim);
  border-radius: var(--r-sm);
  font-weight: 500;
  cursor: pointer;
  font-size: 0.9rem;
  user-select: none;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-item:hover {
  background: rgba(180,200,255,0.04);
  color: var(--text);
}
.nav-item.active {
  background: linear-gradient(90deg, rgba(123,91,255,0.18), rgba(61,178,255,0.06) 60%, transparent);
  color: var(--text);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 2px;
  background: linear-gradient(180deg, var(--prism-1), var(--prism-2), var(--prism-3));
  border-radius: 2px;
  box-shadow: 0 0 10px var(--prism-2);
}
.nav-item .icon {
  width: 20px; height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--prism-3);
  opacity: 0.9;
  font-size: 0.95rem;
}
.nav-item.active .icon {
  color: var(--gold);
  opacity: 1;
  filter: drop-shadow(0 0 6px rgba(255,200,69,0.5));
}

.sidebar-footer {
  padding: 14px 22px 4px;
  border-top: 1px solid var(--line);
  font-size: 0.72rem;
  color: var(--dim);
  line-height: 1.6;
}
.sidebar-footer a { color: var(--text-dim); }
.sidebar-footer .status-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--jade);
  box-shadow: 0 0 6px var(--jade);
  margin-right: 6px;
  vertical-align: middle;
}

.main {
  padding: 28px 36px 80px;
  max-width: 1440px;
  width: 100%;
}

.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
  flex-wrap: wrap;
}
.main-header h1 { font-size: 2rem; }
.main-header .eyebrow {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--prism-1), var(--prism-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 4px;
}

.tournament-picker { display: flex; align-items: center; gap: 10px; }
.tournament-picker select { min-width: 240px; }

/* Mobile header */
.mobile-header {
  display: none;
  padding: 14px 18px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 90;
  backdrop-filter: blur(12px);
}
.hamburger {
  width: 38px; height: 38px;
  background: var(--panel);
  border: 1px solid var(--line-hi);
  border-radius: var(--r-sm);
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
}

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; left: 0;
    width: 280px; height: 100vh;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .sidebar.open { transform: translateX(0); }
  .mobile-header { display: flex; }
  .main { padding: 18px 14px 60px; }
  .sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(3,4,8,0.7);
    z-index: 99;
    backdrop-filter: blur(4px);
  }
  .sidebar-backdrop.open { display: block; }
}

/* ============================================================ BUTTONS ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-hi);
  background: linear-gradient(180deg, rgba(180,200,255,0.05), rgba(180,200,255,0.01));
  color: var(--text);
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.14s ease;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  opacity: 0.6;
}
.btn:hover {
  border-color: rgba(180,200,255,0.28);
  background: linear-gradient(180deg, rgba(180,200,255,0.08), rgba(180,200,255,0.02));
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

/* Loading state for buttons */
.btn.loading { pointer-events: none; opacity: 0.7; }
.btn-spin {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid rgba(255,255,255,0.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btn-spin 0.7s linear infinite;
  margin-right: 6px;
  vertical-align: -1px;
}
@keyframes btn-spin { to { transform: rotate(360deg); } }

/* Primary = prismatic — the signature "premium variant" feel */
.btn-primary {
  background: linear-gradient(135deg, #FF5BB5 0%, #7B5BFF 50%, #3DB2FF 100%);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
  box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 24px rgba(123,91,255,0.4);
  text-shadow: 0 1px 0 rgba(0,0,0,0.22);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #FF78C3 0%, #8F74FF 50%, #5BBEFF 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 30px rgba(123,91,255,0.55);
  border-color: rgba(255,255,255,0.28);
}

.btn-gold {
  background: linear-gradient(180deg, #FFDD7A, #E9AF22);
  border-color: rgba(255,255,255,0.25);
  color: #1A140A;
  box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 4px 20px rgba(255,200,69,0.32);
  text-shadow: 0 1px 0 rgba(255,255,255,0.15);
}
.btn-gold:hover {
  background: linear-gradient(180deg, #FFE89A, #F2BA2C);
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 28px rgba(255,200,69,0.48);
}

.btn-cyan {
  background: linear-gradient(180deg, #5FE8FF, #1FAFCB);
  border-color: rgba(255,255,255,0.22);
  color: #051620;
  box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 4px 20px rgba(31,227,255,0.32);
}

.btn-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text-dim);
}
.btn-ghost:hover { background: rgba(180,200,255,0.04); color: var(--text); }
.btn-ghost::before { display: none; }

.btn-danger {
  color: var(--ember-hi);
  border-color: rgba(255,77,85,0.4);
  background: rgba(255,77,85,0.08);
}
.btn-danger:hover {
  background: rgba(255,77,85,0.14);
  border-color: rgba(255,77,85,0.6);
}

.btn-sm { padding: 6px 11px; font-size: 0.74rem; }
.btn-xs { padding: 4px 8px; font-size: 0.68rem; letter-spacing: 0.06em; }

/* ============================================================ INPUTS ============================================================ */
input[type="text"], input[type="number"], input[type="date"],
input[type="password"], input[type="email"], select, textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--panel-lo);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  transition: border-color 0.14s, background 0.14s, box-shadow 0.14s;
}
input::placeholder, textarea::placeholder { color: var(--dim); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: rgba(123,91,255,0.55);
  background: var(--panel);
  box-shadow: 0 0 0 3px rgba(123,91,255,0.14);
}
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
                    linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}
label {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 6px;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}
.field { display: flex; flex-direction: column; }
input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.85); cursor: pointer; opacity: 0.9;
}

/* ============================================================ CARDS / PANELS ============================================================ */
.card {
  position: relative;
  background:
    linear-gradient(180deg, rgba(180,200,255,0.03), rgba(180,200,255,0)),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(180,200,255,0.15), transparent);
}
.card + .card { margin-top: 18px; }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
  flex-wrap: wrap;
}
.card-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

/* Accent card — prismatic rarity border, premium-variant feel */
.card-accent {
  background:
    radial-gradient(600px 200px at 0% 0%, rgba(123,91,255,0.14), transparent 60%),
    radial-gradient(500px 200px at 100% 100%, rgba(61,178,255,0.10), transparent 60%),
    var(--panel);
  border-color: transparent;
  position: relative;
}
.card-accent::after {
  /* chromatic rim */
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r-lg);
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,91,181,0.6), rgba(123,91,255,0.3) 40%, rgba(61,178,255,0.6) 80%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

/* "What's Next" dashboard card — gold rim to draw attention */
.card-next {
  position: relative;
  background:
    radial-gradient(600px 220px at 100% 0%, rgba(255,200,69,0.10), transparent 60%),
    var(--panel);
  border: 1px solid rgba(255,200,69,0.28);
}
.card-next::after {
  content: '';
  position: absolute;
  left: 0; top: 14px; bottom: 14px;
  width: 3px;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold), var(--gold-lo));
  box-shadow: 0 0 14px rgba(255,200,69,0.5);
  border-radius: 3px;
}
.card-next .next-eyebrow {
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}
.card-next h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.55rem;
  letter-spacing: 0.01em;
  margin-bottom: 6px;
}
.card-next p.desc {
  color: var(--text-dim);
  font-size: 0.92rem;
  margin-bottom: 14px;
  max-width: 640px;
}
.card-next .next-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ============================================================ STATS — hex cost-gems ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.stat {
  position: relative;
  background: linear-gradient(180deg, rgba(180,200,255,0.03), rgba(180,200,255,0)), var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px 18px 22px;
  overflow: hidden;
}
.stat::before {
  /* chromatic accent rail */
  content: '';
  position: absolute;
  left: 0; top: 10px; bottom: 10px;
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--prism-1), var(--prism-2), var(--prism-3));
  box-shadow: 0 0 10px rgba(123,91,255,0.5);
}
.stat::after {
  /* hex gem in top-right corner */
  content: '';
  position: absolute;
  top: -6px; right: -6px;
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--prism-1), var(--prism-2));
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  opacity: 0.18;
}
.stat.gold::before { background: linear-gradient(180deg, var(--gold-hi), var(--gold), var(--gold-lo)); box-shadow: 0 0 10px rgba(255,200,69,0.5); }
.stat.gold::after  { background: linear-gradient(135deg, var(--gold-hi), var(--gold)); }
.stat.ink::before  { background: linear-gradient(180deg, #8BEEFF, var(--ink)); box-shadow: 0 0 10px rgba(31,227,255,0.5); }
.stat.ink::after   { background: linear-gradient(135deg, #8BEEFF, var(--ink)); }
.stat.ember::before { background: linear-gradient(180deg, var(--ember-hi), var(--ember)); box-shadow: 0 0 10px rgba(255,77,85,0.5); }
.stat.ember::after  { background: linear-gradient(135deg, var(--ember-hi), var(--ember)); }
.stat.jade::before { background: linear-gradient(180deg, #6BECB8, var(--jade)); box-shadow: 0 0 10px rgba(59,227,160,0.5); }
.stat.jade::after  { background: linear-gradient(135deg, #6BECB8, var(--jade)); }

.stat-label {
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--muted);
  margin-bottom: 6px;
}
.stat-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 2.1rem;
  letter-spacing: 0.005em;
  line-height: 1;
  font-style: italic;
  letter-spacing: -0.01em;
  text-shadow: 0 2px 14px rgba(123,91,255,0.25);
}
.stat.gold .stat-value  { color: var(--gold-hi); text-shadow: 0 2px 14px rgba(255,200,69,0.35); }
.stat.ink .stat-value   { color: #8BEEFF; text-shadow: 0 2px 14px rgba(31,227,255,0.35); }
.stat.ember .stat-value { color: var(--ember-hi); text-shadow: 0 2px 14px rgba(255,77,85,0.35); }
.stat.jade .stat-value  { color: #6BECB8; text-shadow: 0 2px 14px rgba(59,227,160,0.35); }
.stat-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 6px; font-style: normal; }

/* ============================================================ BADGES ============================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  background: rgba(180,200,255,0.06);
  color: var(--text-dim);
  border: 1px solid var(--line-hi);
  line-height: 1.1;
}
.badge.red    { background: rgba(255,77,85,0.12); color: var(--ember-hi); border-color: rgba(255,77,85,0.38); }
.badge.gold   { background: rgba(255,200,69,0.12); color: var(--gold); border-color: rgba(255,200,69,0.38); }
.badge.green, .badge.jade  { background: rgba(59,227,160,0.12); color: var(--jade); border-color: rgba(59,227,160,0.38); }
.badge.cyan, .badge.ink    { background: rgba(31,227,255,0.12); color: var(--ink); border-color: rgba(31,227,255,0.38); }
.badge.prism  {
  background: linear-gradient(90deg, rgba(255,91,181,0.12), rgba(61,178,255,0.12));
  border-color: rgba(123,91,255,0.5);
  color: #D7C6FF;
}
.badge.muted  { background: rgba(180,200,255,0.04); color: var(--muted); }

/* ============================================================ TABLES ============================================================ */
.table-wrap { overflow-x: auto; border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  padding: 10px 14px;
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  background: rgba(180,200,255,0.015);
  white-space: nowrap;
}
td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  font-size: 0.9rem;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(180,200,255,0.02); }

.rank-1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  font-style: italic;
  color: var(--gold-hi);
  text-shadow: 0 0 14px rgba(255,200,69,0.5);
}
.rank-2 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; font-weight: 800; font-style: italic; color: var(--silver); }
.rank-3 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; font-weight: 800; font-style: italic; color: var(--bronze); }
td.rank-num { font-family: 'Barlow Condensed', sans-serif; font-size: 1.15rem; font-weight: 700; font-style: italic; color: var(--text-dim); }

/* ============================================================ PAIRINGS ============================================================ */
.pairing {
  position: relative;
  background: linear-gradient(180deg, rgba(180,200,255,0.025), rgba(180,200,255,0)), var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 18px;
  margin-bottom: 10px;
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 20px;
  align-items: center;
  overflow: hidden;
  transition: opacity 0.14s, background 0.14s;
}
.pairing::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
}
.pairing.complete {
  background: linear-gradient(180deg, rgba(180,200,255,0.01), rgba(180,200,255,0)), var(--panel-lo);
  opacity: 0.72;
}
.pairing.complete::before { background: var(--jade); box-shadow: 0 0 8px rgba(59,227,160,0.4); }
.pairing.complete:hover { opacity: 0.92; }
.pairing.bye::before      { background: var(--dim); box-shadow: none; }
.pairing.bye              { opacity: 0.7; }

/* pending pairings get a subtle gold-rim cue to draw the eye */
.pairing.pending { border-color: rgba(255,200,69,0.2); }

.pairings-section-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.pairings-section-label:first-child { margin-top: 0; }
.pairings-section-label .count-chip {
  background: rgba(180,200,255,0.06);
  border: 1px solid var(--line-hi);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}
.pairings-section-label.pending .count-chip {
  background: rgba(255,200,69,0.12);
  border-color: rgba(255,200,69,0.38);
  color: var(--gold);
}
.pairings-section-label.complete .count-chip {
  background: rgba(59,227,160,0.12);
  border-color: rgba(59,227,160,0.38);
  color: var(--jade);
}

.table-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 2.4rem;
  font-weight: 800;
  font-style: italic;
  line-height: 1;
  color: var(--text);
  text-align: center;
  position: relative;
  letter-spacing: -0.02em;
  -webkit-text-stroke: 1px rgba(0,0,0,0.3);
  text-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 14px rgba(123,91,255,0.3);
}
.table-num::after {
  content: 'TABLE';
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--muted);
  margin-top: 2px;
  font-style: normal;
  -webkit-text-stroke: 0;
  text-shadow: none;
}

.pairing-players {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: center;
}
.pairing-player { display: flex; flex-direction: column; gap: 4px; }
.pairing-player .name { font-weight: 600; font-size: 1rem; }
.pairing-player .record { font-size: 0.74rem; color: var(--muted); letter-spacing: 0.02em; }
.pairing-player.right { text-align: right; align-items: flex-end; }
.pairing-vs {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  font-style: italic;
  letter-spacing: 0.08em;
  padding: 4px 12px;
  background: linear-gradient(135deg, rgba(255,91,181,0.12), rgba(123,91,255,0.12), rgba(61,178,255,0.12));
  border: 1px solid rgba(123,91,255,0.38);
  border-radius: 999px;
  color: #D7C6FF;
}
.pairing-result {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  font-style: italic;
  color: var(--gold-hi);
  letter-spacing: 0.02em;
  text-shadow: 0 0 16px rgba(255,200,69,0.45);
}

@media (max-width: 700px) {
  .pairing { grid-template-columns: 1fr; gap: 12px; }
  .pairing-players { grid-template-columns: 1fr; text-align: left !important; }
  .pairing-player.right { text-align: left; align-items: flex-start; }
  .pairing-vs { justify-self: start; }
}

/* Sticky finalize bar for pairings page */
.round-action-bar {
  position: sticky;
  bottom: 12px;
  z-index: 50;
  margin-top: 20px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  border: 1px solid var(--line-hi);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 28px rgba(5,8,20,0.6), 0 0 0 1px rgba(180,200,255,0.05) inset;
  backdrop-filter: blur(8px);
}
.round-action-bar.all-in {
  border-color: rgba(59,227,160,0.38);
  background: linear-gradient(180deg, rgba(59,227,160,0.08), var(--panel));
}
.round-action-bar.pending {
  border-color: rgba(255,200,69,0.38);
  background: linear-gradient(180deg, rgba(255,200,69,0.07), var(--panel));
}
.round-action-bar .rab-status { display: flex; align-items: center; gap: 12px; }
.round-action-bar .rab-pulse {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px var(--gold);
  animation: pulse 1.5s infinite;
}
.round-action-bar .rab-pulse.done {
  background: var(--jade);
  box-shadow: 0 0 10px var(--jade);
  animation: none;
}
.round-action-bar .rab-text strong {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.round-action-bar .rab-text .sub {
  display: block;
  font-size: 0.74rem;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ============================================================ BRACKET ============================================================ */
.bracket {
  display: flex;
  gap: 36px;
  overflow-x: auto;
  padding: 16px 4px;
}
.bracket-round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 14px;
  min-width: 240px;
}
.bracket-match {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  min-width: 240px;
  position: relative;
}
.bracket-match::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--line-hi);
  border-radius: 2px;
}
.bracket-match.complete::before { background: var(--jade); box-shadow: 0 0 8px var(--jade); }
.bracket-slot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  font-size: 0.9rem;
}
.bracket-slot + .bracket-slot { border-top: 1px dashed var(--line); }
.bracket-slot.winner { color: var(--gold-hi); font-weight: 700; text-shadow: 0 0 10px rgba(255,200,69,0.35); }
.bracket-slot.empty { color: var(--dim); font-style: italic; }
.bracket-round-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin-bottom: 6px;
}

/* ============================================================ MODAL ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(5,8,20,0.72);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  padding: 20px;
  animation: fadeIn 0.14s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background:
    linear-gradient(180deg, rgba(180,200,255,0.03), rgba(180,200,255,0)),
    var(--panel);
  border: 1px solid var(--line-hi);
  border-radius: var(--r-lg);
  padding: 26px;
  max-width: 620px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-2);
  position: relative;
  animation: popIn 0.18s cubic-bezier(.2,.8,.2,1);
}
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 24px; right: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(123,91,255,0.5), rgba(61,178,255,0.5), transparent);
}
.modal h2 { margin-bottom: 14px; font-size: 1.5rem; }
.modal-actions {
  display: flex; gap: 10px;
  justify-content: flex-end;
  margin-top: 22px;
  flex-wrap: wrap;
}

/* ============================================================ TOAST ============================================================ */
.toast-container {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
  max-width: 420px;
}
.toast {
  background: var(--panel);
  border: 1px solid var(--line-hi);
  border-left: 3px solid var(--prism-2);
  padding: 12px 18px;
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-2);
  animation: slideIn 0.22s cubic-bezier(.2,.8,.2,1);
  font-size: 0.88rem;
}
.toast.success { border-left-color: var(--jade); }
.toast.error   { border-left-color: var(--ember); }
.toast.info    { border-left-color: var(--ink); }
@keyframes slideIn {
  from { transform: translateX(110%); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}

/* ============================================================ UTILS ============================================================ */
.row { display: flex; gap: 12px; align-items: center; }
.row-between { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.gap-sm { gap: 8px; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.center { text-align: center; }
.mt-md { margin-top: 16px; }
.mt-lg { margin-top: 24px; }
.mb-md { margin-bottom: 16px; }

.empty-state {
  text-align: center;
  padding: 52px 24px;
  color: var(--muted);
}
.empty-state h3 { color: var(--text); margin-bottom: 8px; font-size: 1.25rem; }

.copy-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--panel-lo);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
}
.copy-link .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }

pre.sql {
  background: var(--panel-lo);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 16px;
  overflow-x: auto;
  font-size: 0.78rem;
  font-family: 'JetBrains Mono', monospace;
  white-space: pre;
  max-height: 400px;
  overflow-y: auto;
  color: var(--text-dim);
}

hr.sep { border: none; border-top: 1px solid var(--line); margin: 20px 0; }

.checkbox-row {
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-size: 0.9rem;
}
.checkbox-row input { width: auto; accent-color: var(--prism-2); }

.game-row {
  display: grid;
  grid-template-columns: 60px 1fr 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.game-row .label { font-size: 0.8rem; color: var(--muted); }

.help-hint {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--line-hi);
  color: var(--text-dim);
  font-size: 0.66rem;
  font-weight: 700;
  margin-left: 6px;
  cursor: help;
}
.help-hint:hover { background: var(--gold); color: #1A140A; }

.pill-tag {
  display: inline-block;
  padding: 2px 9px;
  background: var(--line-hi);
  color: var(--text-dim);
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-right: 4px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 20px;
}
@media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }

/* ============================================================ SPECTATOR ============================================================ */
.spectator-header {
  text-align: center;
  padding: 44px 20px 28px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.spectator-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(600px 220px at 50% 0%, rgba(123,91,255,0.18), transparent 70%),
    radial-gradient(500px 180px at 50% 100%, rgba(61,178,255,0.12), transparent 70%);
  z-index: -1;
}
.spectator-header h1 {
  font-size: 2.8rem;
  margin-bottom: 4px;
  font-weight: 800;
  letter-spacing: 0.015em;
}
.spectator-header .meta {
  color: var(--muted);
  font-size: 0.74rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 600;
}
.spectator-tabs {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin: 18px 0 4px;
  flex-wrap: wrap;
}
.spectator-tab {
  padding: 9px 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--text-dim);
  transition: all 0.14s;
}
.spectator-tab:hover { border-color: var(--line-hi); color: var(--text); }
.spectator-tab.active {
  background: linear-gradient(135deg, #FF5BB5, #7B5BFF 50%, #3DB2FF);
  color: #fff;
  border-color: rgba(255,255,255,0.24);
  box-shadow: var(--glow-prism);
}

.live-dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--jade);
  border-radius: 50%;
  margin-right: 6px;
  box-shadow: 0 0 8px var(--jade);
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Sidebar share button — spectator share accessible everywhere */
.sidebar-share-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  margin-bottom: 10px;
  background: linear-gradient(135deg, rgba(255,91,181,0.14), rgba(123,91,255,0.14), rgba(61,178,255,0.14));
  border: 1px solid rgba(123,91,255,0.38);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.14s;
}
.sidebar-share-btn:hover {
  background: linear-gradient(135deg, rgba(255,91,181,0.26), rgba(123,91,255,0.26), rgba(61,178,255,0.26));
  border-color: rgba(123,91,255,0.6);
}
.sidebar-share-btn .share-icon {
  width: 14px; height: 14px;
  background: linear-gradient(135deg, var(--prism-1), var(--prism-3));
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  flex-shrink: 0;
}

/* ============================================================ CARDS (game) & DECK PREVIEW ============================================================ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.card-tile {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
  position: relative;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.card-tile:hover {
  transform: translateY(-3px);
  border-color: rgba(255,200,69,0.5);
  box-shadow: var(--glow-gold);
}
.card-tile.empty {
  aspect-ratio: 2 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dim);
  border-style: dashed;
  cursor: default;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}
.card-tile.empty:hover { transform: none; border-color: var(--line); box-shadow: none; }
.card-tile img {
  width: 100%;
  display: block;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  background: var(--bg-1);
}
.card-tile .cost-chip {
  /* Hex cost gem — Snap style */
  position: absolute;
  top: 6px; left: 6px;
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--gold-hi), var(--gold), var(--gold-lo));
  color: #2A1D05;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 1.15rem; font-style: italic;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);

<script type="module">
// ============================================================
// IMPORTS
// ============================================================
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ============================================================
// CONSTANTS
// ============================================================
const LS_KEYS = {
  SUPABASE_URL: 'snapto_supabase_url',
  SUPABASE_KEY: 'snapto_supabase_key',
  PIN_HASH: 'snapto_pin_hash',
  ACTIVE_TOURNAMENT: 'snapto_active_tournament',
  UI_PREFS: 'snapto_ui_prefs',
  AUTHED: 'snapto_authed_session',
};

const SQL_MIGRATION = `-- Snap TO: run this once in your Supabase project's SQL Editor
-- (Dashboard > SQL Editor > New Query)

create table if not exists tournaments (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  date date,
  format text not null default 'swiss',
  config jsonb not null default '{}'::jsonb,
  status text not null default 'setup',
  created_at timestamptz default now()
);

create table if not exists players (
  id uuid primary key default gen_random_uuid(),
  tournament_id uuid references tournaments(id) on delete cascade,
  name text not null,
  alias text,
  seed int,
  stats jsonb default '{}'::jsonb,
  checked_in boolean default false,
  dropped boolean default false,
  created_at timestamptz default now()
);

create table if not exists rounds (
  id uuid primary key default gen_random_uuid(),
  tournament_id uuid references tournaments(id) on delete cascade,
  round_number int not null,
  status text not null default 'pending',
  finalized_at timestamptz,
  created_at timestamptz default now()
);

create table if not exists pairings (
  id uuid primary key default gen_random_uuid(),
  round_id uuid references rounds(id) on delete cascade,
  player1_id uuid references players(id) on delete set null,
  player2_id uuid references players(id) on delete set null,
  result jsonb default '{}'::jsonb,
  is_bye boolean default false,
  table_number int,
  bracket_stage text,
  created_at timestamptz default now()
);

create table if not exists decks (
  id uuid primary key default gen_random_uuid(),
  player_id uuid references players(id) on delete cascade,
  tournament_id uuid references tournaments(id) on delete cascade,
  deck_name text,
  cards jsonb default '[]'::jsonb,
  revealed boolean default false,
  created_at timestamptz default now()
);

-- Card library (global, shared across tournaments)
create table if not exists cards (
  carddefid text primary key,
  cid int,
  name text not null,
  cost int,
  power int,
  type text,
  ability text,
  art text,
  source text,
  status text,
  tags jsonb default '[]'::jsonb,
  updated_at timestamptz default now()
);

-- Location library (global, shared across tournaments)
create table if not exists locations (
  carddefid text primary key,
  cid int,
  name text not null,
  ability text,
  flavor text,
  art text,
  status text,
  updated_at timestamptz default now()
);

-- Avatar library (global, shared across tournaments)
create table if not exists avatars (
  avatardefid text primary key,
  cid int,
  name text,
  category text,
  art text,
  source text,
  status text,
  updated_at timestamptz default now()
);

-- Row-level security: open read + write on the anon key.
-- The TO UI is client-side PIN protected.
-- For production hardening, replace with auth + scoped policies.
alter table tournaments enable row level security;
alter table players enable row level security;
alter table rounds enable row level security;
alter table pairings enable row level security;
alter table decks enable row level security;
alter table cards enable row level security;
alter table locations enable row level security;
alter table avatars enable row level security;

do $$ begin
  create policy "anon all tournaments" on tournaments for all using (true) with check (true);
  create policy "anon all players" on players for all using (true) with check (true);
  create policy "anon all rounds" on rounds for all using (true) with check (true);
  create policy "anon all pairings" on pairings for all using (true) with check (true);
  create policy "anon all decks" on decks for all using (true) with check (true);
  create policy "anon all cards" on cards for all using (true) with check (true);
  create policy "anon all locations" on locations for all using (true) with check (true);
  create policy "anon all avatars" on avatars for all using (true) with check (true);
exception when duplicate_object then null; end $$;

-- Enable Realtime for spectator mode (safe to re-run)
do $$ begin
  alter publication supabase_realtime add table tournaments;
exception when duplicate_object then null; end $$;
do $$ begin
  alter publication supabase_realtime add table players;
exception when duplicate_object then null; end $$;
do $$ begin
  alter publication supabase_realtime add table rounds;
exception when duplicate_object then null; end $$;
do $$ begin
  alter publication supabase_realtime add table pairings;
exception when duplicate_object then null; end $$;
do $$ begin
  alter publication supabase_realtime add table decks;
exception when duplicate_object then null; end $$;
`;

// ============================================================
// STATE
// ============================================================
const state = {
  mode: 'to',              // 'to' | 'spectator' | 'register'
  authed: false,
  route: 'dashboard',      // dashboard | players | setup | pairings | standings | bracket | decks | cards
  specRoute: 'standings',  // standings | pairings | bracket
  supabase: null,
  tournaments: [],
  activeTournamentId: null,
  activeTournament: null,
  players: [],
  rounds: [],
  pairings: [],
  decks: [],
  cards: [],               // global card library
  cardsIndex: new Map(),   // carddefid -> card object, built from cards[]
  locations: [],           // global location library
  avatars: [],             // global avatar library
  avatarsIndex: new Map(), // avatardefid -> avatar object
  needsSetup: false,       // supabase creds missing
  sidebarOpen: false,
  lastUpdated: null,
  realtimeChannel: null,
  loading: {},             // keyed loading flags for button indicators

};

// ============================================================
// UTILITIES
// ============================================================
function el(id) { return document.getElementById(id); }

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function uid() {
  return crypto.randomUUID();
}

function toast(msg, variant = 'info') {
  const root = el('toast-root');
  const t = document.createElement('div');
  t.className = `toast ${variant}`;
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.2s';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 200);
  }, 3200);
}

function confirm(message, onConfirm, opts = {}) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <h2>${esc(opts.title || 'Confirm')}</h2>
      <p class="muted">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="cancel">Cancel</button>
        <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${esc(opts.okLabel || 'Confirm')}</button>
      </div>
    </div>`;
  document.getElementById('modal-root').appendChild(backdrop);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop || e.target.dataset.act === 'cancel') backdrop.remove();
    if (e.target.dataset.act === 'ok') { backdrop.remove(); onConfirm(); }
  });
}

function openModal(html, onMount) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">${html}</div>`;
  document.getElementById('modal-root').appendChild(backdrop);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop || e.target.dataset.close !== undefined) backdrop.remove();
  });
  if (onMount) onMount(backdrop);
  return backdrop;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(
    () => toast('Copied to clipboard', 'success'),
    () => toast('Copy failed — select and copy manually', 'error')
  );
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return (n * 100).toFixed(1) + '%';
}

function fmtCubeDiff(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n;
}

function setLoading(key, on) {
  state.loading[key] = !!on;
  // Toggle UI on any button with a matching data-loading-key
  document.querySelectorAll(`[data-loading-key="${key}"]`).forEach(btn => {
    if (on) {
      btn.classList.add('loading');
      btn.disabled = true;
      if (!btn.querySelector('.btn-spin')) {
        const originalHTML = btn.innerHTML;
        btn.dataset.originalLabel = originalHTML;
        btn.innerHTML = `<span class="btn-spin"></span><span class="btn-label">${originalHTML}</span>`;
      }
    } else {
      btn.classList.remove('loading');
      btn.disabled = false;
      if (btn.dataset.originalLabel) {
        btn.innerHTML = btn.dataset.originalLabel;
        delete btn.dataset.originalLabel;
      }
    }
  });
}

async function withLoading(key, fn) {
  setLoading(key, true);
  try { return await fn(); }
  finally { setLoading(key, false); }
}

// ============================================================

/**
 * Decode a Marvel Snap deck code.
 * Long format (pre/post all): base64 of {"Cards":[{"CardDefId":"..."}],"Name":"..."}
 * Short format (post-2024): abbreviated card names, not yet supported here.
 * Returns { name, cardDefIds } on success, { error } on failure.
 */
function decodeDeckCode(raw) {
  if (!raw) return { error: 'Empty' };
  const code = raw.trim();
  if (!code) return { error: 'Empty' };

  // Long format: base64-encoded JSON, always starts with "eyJ" (that's `{"` in base64)
  if (code.startsWith('eyJ')) {
    try {
      // Handle URL-safe base64 and pad if needed
      let b64 = code.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const json = atob(b64);
      const parsed = JSON.parse(json);
      if (!parsed || !Array.isArray(parsed.Cards)) {
        return { error: 'Decoded JSON is missing Cards array' };
      }
      const ids = parsed.Cards.map(c => c && c.CardDefId).filter(Boolean);
      if (ids.length === 0) return { error: 'No cards found in code' };
      return { name: parsed.Name || null, cardDefIds: ids, format: 'long' };
    } catch (err) {
      return { error: 'Invalid deck code: ' + err.message };
    }
  }

  // Short format (abbreviated names). We don't decode these yet.
  // Heuristic: looks like concatenated tokens with digits, no punctuation.
  if (/^[A-Za-z0-9]+$/.test(code) && code.length < 120) {
    return { error: 'Short-format deck code detected. Please paste the long format (starts with "eyJ"). You can get it from snap.fan, untapped.gg, or a converter.' };
  }

  return { error: 'Unrecognized deck code format' };
}

function buildCardsIndex() {
  state.cardsIndex = new Map();
  state.cards.forEach(c => {
    if (c.carddefid) state.cardsIndex.set(c.carddefid, c);
  });
}

function lookupCard(carddefid) {
  return state.cardsIndex.get(carddefid) || null;
}

function humanizeCardDefId(carddefid) {
  // Fallback display when card not in library yet: "AbsorbingMan" -> "Absorbing Man"
  if (!carddefid) return '';
  return carddefid.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Z])([A-Z][a-z])/g, '$1 $2');
}

// ============================================================
// AVATARS (library index + player rendering)
// ============================================================
function buildAvatarsIndex() {
  state.avatarsIndex = new Map();
  state.avatars.forEach(a => {
    if (a.avatardefid) state.avatarsIndex.set(a.avatardefid, a);
  });
}

function lookupAvatar(avatardefid) {
  return state.avatarsIndex.get(avatardefid) || null;
}

/**
 * Avatar is stored on player.stats.avatar as either:
 *   { type: 'avatar', avatardefid: '...' }   // NEW: real game avatar
 *   { type: 'card', carddefid: 'IronMan' }   // LEGACY: card-art avatar (kept for back-compat)
 *   { type: 'drawn', dataUrl: 'data:image/png;base64,...' }
 * or absent / null.
 */
function getPlayerAvatar(player) {
  return player?.stats?.avatar || null;
}

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function renderAvatar(player, size = 'md') {
  const avatar = getPlayerAvatar(player);
  const name = player?.name || '?';
  if (avatar?.type === 'avatar') {
    const av = lookupAvatar(avatar.avatardefid);
    if (av?.art) {
      return `<span class="avatar ${size}" title="${esc(name)}"><img src="${esc(av.art)}" alt="" onerror="this.parentElement.innerHTML='${esc(getInitials(name))}'" /></span>`;
    }
  }
  if (avatar?.type === 'card') {
    const card = lookupCard(avatar.carddefid);
    if (card?.art) {
      return `<span class="avatar ${size}" title="${esc(name)}"><img src="${esc(card.art)}" alt="" onerror="this.parentElement.innerHTML='${esc(getInitials(name))}'" /></span>`;
    }
  }
  if (avatar?.type === 'drawn' && avatar.dataUrl) {
    return `<span class="avatar ${size}" title="${esc(name)}"><img src="${esc(avatar.dataUrl)}" alt="" /></span>`;
  }
  return `<span class="avatar ${size}" title="${esc(name)}">${esc(getInitials(name))}</span>`;
}

function renderPlayerRow(player, size = 'sm') {
  if (!player) return '';
  return `<span class="player-row">${renderAvatar(player, size)}<span>${esc(player.name)}</span></span>`;
}

/**
 * Render an avatar picker inside a container.
 * Two modes: 'avatar' (grid of real game avatars) and 'draw' (canvas pad).
 * Calls onSelect(avatar) when the user picks one.
 */
function mountAvatarPicker(container, opts = {}) {
  const initial = opts.initial || null;
  let current = initial;
  // Default to 'avatar' mode; legacy 'card' avatars still render fine via renderAvatar.
  let mode = (initial?.type === 'drawn') ? 'draw' : 'avatar';

  function render() {
    container.innerHTML = `
      <div class="row" style="margin-bottom:10px; gap:6px;">
        <button type="button" class="btn btn-sm ${mode === 'avatar' ? 'btn-gold' : 'btn-ghost'}" data-avatar-mode="avatar">Pick an Avatar</button>
        <button type="button" class="btn btn-sm ${mode === 'draw' ? 'btn-gold' : 'btn-ghost'}" data-avatar-mode="draw">Draw Your Own</button>
        <button type="button" class="btn btn-sm btn-ghost" data-avatar-mode="none">Skip (use initials)</button>
      </div>
      <div id="avatar-body"></div>
    `;
    container.querySelectorAll('[data-avatar-mode]').forEach(b => {
      b.addEventListener('click', () => {
        const m = b.dataset.avatarMode;
        if (m === 'none') {
          current = null;
          opts.onSelect?.(null);
          return;
        }
        mode = m;
        render();
      });
    });
    if (mode === 'avatar') renderAvatarMode();
    else renderDrawMode();
  }

  function renderAvatarMode() {
    const body = container.querySelector('#avatar-body');
    const avatars = state.avatars.filter(a => a.art && (!a.status || a.status === 'released' || a.status === 'Released'));
    if (avatars.length === 0) {
      body.innerHTML = `
        <div class="avatar-picker-empty">
          <strong>No avatars synced yet.</strong><br />
          The organizer needs to sync the avatar library first (Card Library page → Sync All).
          Until then you can still draw your own or skip.
        </div>
      `;
      return;
    }
    const sorted = [...avatars].sort((a, b) => (a.name || a.avatardefid).localeCompare(b.name || b.avatardefid));
    body.innerHTML = `
      <input type="text" id="avatar-search" placeholder="Search avatars..." style="margin-bottom:8px;" />
      <div class="avatar-chooser" id="avatar-choices">
        ${renderChoices(sorted)}
      </div>
    `;
    body.querySelector('#avatar-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = q
        ? sorted.filter(a => (a.name || '').toLowerCase().includes(q) || a.avatardefid.toLowerCase().includes(q))
        : sorted;
      body.querySelector('#avatar-choices').innerHTML = renderChoices(filtered);
      attachChoiceHandlers();
    });
    attachChoiceHandlers();
  }

  function renderChoices(list) {
    return list.map(a => `
      <div class="avatar-choice ${current?.type === 'avatar' && current.avatardefid === a.avatardefid ? 'selected' : ''}"
           data-pick="${esc(a.avatardefid)}" title="${esc(a.name || a.avatardefid)}">
        <img src="${esc(a.art)}" alt="${esc(a.name || a.avatardefid)}" loading="lazy" />
      </div>
    `).join('');
  }

  function attachChoiceHandlers() {
    container.querySelectorAll('.avatar-choice[data-pick]').forEach(c => {
      c.addEventListener('click', () => {
        current = { type: 'avatar', avatardefid: c.dataset.pick };
        container.querySelectorAll('.avatar-choice').forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
        opts.onSelect?.(current);
      });
    });
  }

  function renderDrawMode() {
    const body = container.querySelector('#avatar-body');
    body.innerHTML = `
      <div class="draw-pad-wrap">
        <canvas class="draw-pad" id="draw-canvas" width="240" height="240"></canvas>
        <div class="draw-tools">
          ${['#0A0B14', '#E62429', '#FFC233', '#3B82F6', '#2EB872', '#FFFFFF'].map(color => `
            <div class="draw-color" data-color="${color}" style="background:${color};"></div>
          `).join('')}
          <button type="button" class="btn btn-xs" id="draw-clear">Clear</button>
        </div>
        <p class="muted" style="font-size:0.75rem; text-align:center;">
          Draw in the circle. Works with mouse or finger on touchscreen.
        </p>
      </div>
    `;
    const canvas = body.querySelector('#draw-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let lastX = 0, lastY = 0;
    let color = '#0A0B14';
    let lineWidth = 5;

    // White circle background so saved image is clean
    function clearCanvas() {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    clearCanvas();

    // Load initial drawing if present
    if (current?.type === 'drawn' && current.dataUrl) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = current.dataUrl;
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches?.[0];
      const cx = touch ? touch.clientX : e.clientX;
      const cy = touch ? touch.clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      const p = pointerPos(e);
      lastX = p.x; lastY = p.y;
    }

    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = pointerPos(e);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    }

    function end() {
      if (!drawing) return;
      drawing = false;
      // Save as data URL
      current = { type: 'drawn', dataUrl: canvas.toDataURL('image/png') };
      opts.onSelect?.(current);
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', end);

    body.querySelectorAll('.draw-color').forEach(c => {
      if (c.dataset.color === color) c.classList.add('selected');
      c.addEventListener('click', () => {
        color = c.dataset.color;
        body.querySelectorAll('.draw-color').forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
      });
    });

    body.querySelector('#draw-clear').addEventListener('click', () => {
      clearCanvas();
      current = null;
      opts.onSelect?.(null);
    });
  }

  render();
}

function renderCardTile(carddefid, opts = {}) {
  const card = lookupCard(carddefid);
  if (!card) {
    return `
      <div class="card-tile unknown" title="Card not in library — sync the Card Library">
        <img src="" alt="" />
        <div class="name-strip">${esc(humanizeCardDefId(carddefid))}</div>
      </div>
    `;
  }
  const titleParts = [card.name];
  if (card.cost != null) titleParts.push(`Cost ${card.cost}`);
  if (card.power != null) titleParts.push(`Power ${card.power}`);
  if (card.ability) titleParts.push(card.ability.replace(/<[^>]*>/g, ''));
  return `
    <div class="card-tile" title="${esc(titleParts.join(' · '))}">
      <img src="${esc(card.art || '')}" alt="${esc(card.name)}" loading="lazy"
           onerror="this.style.opacity='0.2'" />
      ${opts.showName !== false ? `<div class="name-strip">${esc(card.name)}</div>` : ''}
    </div>
  `;
}

// Parse ability type from ability text
function getAbilityType(card) {
  const raw = (card?.ability || '').replace(/<[^>]*>/g, '').toLowerCase().trim();
  if (!raw) return 'no-ability';
  if (raw.includes('on reveal')) return 'on-reveal';
  if (raw.includes('ongoing')) return 'ongoing';
  if (raw.includes('end of turn') || raw.includes('at the end of')) return 'end-of-turn';
  if (raw.includes('start of turn') || raw.includes('at the start')) return 'start-of-turn';
  if (raw.includes('activate')) return 'activate';
  return 'other';
}

// Collect all unique tags from loaded cards (for synergy filter)
function collectCardTags(cardList) {
  const counts = new Map();
  const list = cardList || state.cards;
  list.forEach(c => {
    (c.tags || []).forEach(t => {
      if (!t) return;
      counts.set(t, (counts.get(t) || 0) + 1);
    });
  });
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([tag, count]) => ({ tag, count }));
}

function renderDeckPreview(cardDefIds, opts = {}) {
  const cards = cardDefIds.map(id => ({ id, card: lookupCard(id) }));
  const known = cards.filter(c => c.card);
  const unknownCount = cards.length - known.length;
  const totalCost = known.reduce((a, b) => a + (b.card.cost || 0), 0);
  const avgCost = known.length ? (totalCost / known.length).toFixed(1) : '—';
  const totalPower = known.reduce((a, b) => a + (b.card.power || 0), 0);

  // Cost curve 0..6+
  const buckets = [0, 0, 0, 0, 0, 0, 0];
  known.forEach(c => {
    const cost = Math.min(6, Math.max(0, c.card.cost || 0));
    buckets[cost]++;
  });
  const maxBucket = Math.max(1, ...buckets);

  return `
    <div class="deck-grid">
      ${cardDefIds.map(id => renderCardTile(id)).join('')}
      ${Array.from({ length: Math.max(0, 12 - cardDefIds.length) }, () =>
        `<div class="card-tile empty">empty</div>`).join('')}
    </div>
    ${opts.stats !== false ? `
      <div class="deck-stats">
        <div class="deck-stat">
          <div class="deck-stat-label">Cards</div>
          <div class="deck-stat-value">${cardDefIds.length}/12</div>
        </div>
        <div class="deck-stat">
          <div class="deck-stat-label">Avg Cost</div>
          <div class="deck-stat-value">${avgCost}</div>
        </div>
        <div class="deck-stat">
          <div class="deck-stat-label">Total Power</div>
          <div class="deck-stat-value">${totalPower}</div>
        </div>
        ${unknownCount > 0 ? `
          <div class="deck-stat" style="border-color:var(--red-dim);">
            <div class="deck-stat-label" style="color:var(--red-hi);">Unknown</div>
            <div class="deck-stat-value" style="color:var(--red-hi);">${unknownCount}</div>
          </div>
        ` : ''}
      </div>
      ${opts.curve !== false ? `
        <div>
          <div style="font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-top:14px; margin-bottom:4px;">Cost Curve</div>
          <div class="cost-curve">
            ${buckets.map((b, i) => `
              <div class="cost-curve-bar">
                <div style="font-size:0.68rem;">${b || ''}</div>
                <div class="bar" style="height: ${Math.round((b / maxBucket) * 36)}px;"></div>
                <div>${i === 6 ? '6+' : i}</div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    ` : ''}
  `;
}


// ============================================================
// SUPABASE CLIENT
// ============================================================
function initSupabase() {
  const url = localStorage.getItem(LS_KEYS.SUPABASE_URL);
  const key = localStorage.getItem(LS_KEYS.SUPABASE_KEY);
  if (!url || !key) {
    state.needsSetup = true;
    return false;
  }
  try {
    state.supabase = createClient(url, key, {
      realtime: { params: { eventsPerSecond: 5 } }
    });
    state.needsSetup = false;
    return true;
  } catch (err) {
    console.error(err);
    state.needsSetup = true;
    return false;
  }
}

async function checkConnection() {
  try {
    const { error } = await state.supabase.from('tournaments').select('id', { count: 'exact', head: true });
    if (error) {
      return { ok: false, error: error.message };
    }
    return { ok: true };
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

// ============================================================
// DATA LAYER
// ============================================================
async function loadTournaments() {
  const { data, error } = await state.supabase
    .from('tournaments')
    .select('*')
    .order('created_at', { ascending: false });
  if (error) { toast('Failed to load tournaments: ' + error.message, 'error'); return []; }
  state.tournaments = data || [];
  return state.tournaments;
}

async function loadTournamentData(tournamentId) {
  if (!tournamentId) {
    state.activeTournament = null;
    state.players = []; state.rounds = []; state.pairings = []; state.decks = [];
    return;
  }
  const sb = state.supabase;
  const [t, p, r, d] = await Promise.all([
    sb.from('tournaments').select('*').eq('id', tournamentId).single(),
    sb.from('players').select('*').eq('tournament_id', tournamentId).order('seed', { ascending: true, nullsFirst: false }),
    sb.from('rounds').select('*').eq('tournament_id', tournamentId).order('round_number', { ascending: true }),
    sb.from('decks').select('*').eq('tournament_id', tournamentId),
  ]);
  if (t.error) { toast('Load tournament failed: ' + t.error.message, 'error'); return; }
  state.activeTournament = t.data;
  state.players = p.data || [];
  state.rounds = r.data || [];
  state.decks = d.data || [];

  if (state.rounds.length > 0) {
    const roundIds = state.rounds.map(r => r.id);
    const pairs = await sb.from('pairings').select('*').in('round_id', roundIds);
    state.pairings = pairs.data || [];
  } else {
    state.pairings = [];
  }
  state.lastUpdated = new Date();
}

async function createTournament(data) {
  const { data: t, error } = await state.supabase
    .from('tournaments')
    .insert({
      name: data.name,
      date: data.date || null,
      format: data.format,
      config: data.config,
      status: 'setup'
    })
    .select()
    .single();
  if (error) { toast('Create failed: ' + error.message, 'error'); return null; }
  toast('Tournament created', 'success');
  return t;
}

async function updateTournament(id, patch) {
  const { error } = await state.supabase.from('tournaments').update(patch).eq('id', id);
  if (error) { toast('Update failed: ' + error.message, 'error'); return false; }
  return true;
}

async function deleteTournament(id) {
  const { error } = await state.supabase.from('tournaments').delete().eq('id', id);
  if (error) { toast('Delete failed: ' + error.message, 'error'); return false; }
  toast('Tournament deleted', 'success');
  return true;
}

async function addPlayer(tournamentId, data) {

    .select()
    .single();
  if (error) { toast('Add player failed: ' + error.message, 'error'); return null; }

}

async function updatePlayer(id, patch) {
  const { error } = await state.supabase.from('players').update(patch).eq('id', id);
  if (error) { toast('Update failed: ' + error.message, 'error'); return false; }

}

async function removePlayer(id) {
  const { error } = await state.supabase.from('players').delete().eq('id', id);
  if (error) { toast('Remove failed: ' + error.message, 'error'); return false; }

}

async function createRound(tournamentId, roundNumber, bracketStage = null) {
  const { data, error } = await state.supabase

  const chunkSize = 100;
  let saved = 0;
  for (let i = 0; i < records.length; i += chunkSize) {
    const chunk = records.slice(i, i + chunkSize);
    const { error } = await state.supabase
      .from('cards')
      .upsert(chunk, { onConflict: 'carddefid' });
    if (error) {
      toast(`Save failed at chunk ${i / chunkSize}: ${error.message}`, 'error');
      return saved;

    saved += chunk.length;

// ============================================================
// PAIRING ENGINE — SWISS
// ============================================================
function computePlayerRecord(playerId) {
  const finalizedRounds = state.rounds.filter(r => r.status === 'finalized').map(r => r.id);
  const pairings = state.pairings.filter(p => finalizedRounds.includes(p.round_id));
  const byeCubes = (state.activeTournament?.config?.byeCubeValue) ?? 8;
  const rec = { matchPoints: 0, cubesWon: 0, cubesLost: 0, opponents: [], hadBye: false, wins: 0, losses: 0, draws: 0 };
  pairings.forEach(p => {
    if (p.is_bye && p.player1_id === playerId) {
      rec.matchPoints += 3;
      rec.wins++;
      rec.hadBye = true;
      rec.cubesWon += byeCubes;
      return;
    }
    const r = p.result || {};
    if (!r.winner) return;
    if (p.player1_id === playerId) {
      rec.opponents.push(p.player2_id);
      rec.cubesWon += r.cubes1 || 0;
      rec.cubesLost += r.cubes2 || 0;
      if (r.winner === 'player1') { rec.matchPoints += 3; rec.wins++; }
      else if (r.winner === 'player2') { rec.losses++; }
      else if (r.winner === 'draw') { rec.matchPoints += 1; rec.draws++; }
    } else if (p.player2_id === playerId) {
      rec.opponents.push(p.player1_id);
      rec.cubesWon += r.cubes2 || 0;
      rec.cubesLost += r.cubes1 || 0;
      if (r.winner === 'player2') { rec.matchPoints += 3; rec.wins++; }
      else if (r.winner === 'player1') { rec.losses++; }
      else if (r.winner === 'draw') { rec.matchPoints += 1; rec.draws++; }
    }
  });
  return rec;
}

function pairSwiss() {
  const active = state.players
    .filter(p => p.checked_in && !p.dropped)
    .map(p => ({ ...p, rec: computePlayerRecord(p.id) }));

  active.sort((a, b) => {
    if (b.rec.matchPoints !== a.rec.matchPoints) return b.rec.matchPoints - a.rec.matchPoints;
    const aDiff = a.rec.cubesWon - a.rec.cubesLost;
    const bDiff = b.rec.cubesWon - b.rec.cubesLost;
    if (bDiff !== aDiff) return bDiff - aDiff;
    return (a.seed || 0) - (b.seed || 0);
  });

  let byePlayer = null;
  let pool = [...active];

  if (pool.length % 2 === 1) {
    for (let i = pool.length - 1; i >= 0; i--) {
      if (!pool[i].rec.hadBye) {
        byePlayer = pool.splice(i, 1)[0];
        break;
      }
    }
    if (!byePlayer) byePlayer = pool.pop();
  }

  function pairRec(remaining) {
    if (remaining.length === 0) return [];
    const first = remaining[0];
    const rest = remaining.slice(1);

    for (let i = 0; i < rest.length; i++) {
      const opp = rest[i];
      if (first.rec.opponents.includes(opp.id)) continue;
      const next = rest.filter((_, idx) => idx !== i);
      const sub = pairRec(next);
      if (sub !== null) {
        return [{ player1_id: first.id, player2_id: opp.id, is_bye: false }, ...sub];
      }
    }
    for (let i = 0; i < rest.length; i++) {
      const opp = rest[i];
      const next = rest.filter((_, idx) => idx !== i);
      const sub = pairRec(next);
      if (sub !== null) {
        return [{ player1_id: first.id, player2_id: opp.id, is_bye: false }, ...sub];
      }
    }
    return null;
  }

  const pairings = pairRec(pool) || [];
  if (byePlayer) {
    pairings.push({ player1_id: byePlayer.id, player2_id: null, is_bye: true });
  }
  return pairings;
}

// ============================================================
// PAIRING ENGINE — SINGLE ELIM (TOP CUT)
// ============================================================
function buildTopCut(topN) {
  const standings = computeStandings().filter(s => !s.player.dropped);
  const max = Math.min(topN, standings.length);
  if (max < 2) return [];
  let size = 2;
  while (size * 2 <= max) size *= 2;
  const top = standings.slice(0, size);
  const order = standardBracketOrder(size);
  const pairings = [];
  for (let i = 0; i < order.length; i += 2) {
    const a = top[order[i] - 1];
    const b = top[order[i + 1] - 1];
    pairings.push({ player1_id: a.player.id, player2_id: b ? b.player.id : null, is_bye: !b });
  }
  return pairings;
}

function standardBracketOrder(n) {
  let arr = [1, 2];
  while (arr.length < n) {
    const next = [];
    const sum = arr.length * 2 + 1;
    arr.forEach(x => {
      next.push(x);
      next.push(sum - x);
    });
    arr = next;
  }
  return arr.slice(0, n);
}

function buildNextElimRound(prevElimPairings) {
  const winners = prevElimPairings.map(p => {
    if (p.is_bye) return p.player1_id;
    const r = p.result || {};
    if (r.winner === 'player1') return p.player1_id;
    if (r.winner === 'player2') return p.player2_id;
    return null;
  });
  if (winners.some(w => !w)) return null;
  if (winners.length <= 1) return [];
  const pairings = [];
  for (let i = 0; i < winners.length; i += 2) {
    pairings.push({
      player1_id: winners[i],
      player2_id: winners[i + 1] || null,
      is_bye: !winners[i + 1]
    });
  }
  return pairings;
}

// ============================================================
// STANDINGS ENGINE
// ============================================================
function computeStandings() {
  const byeCubes = (state.activeTournament?.config?.byeCubeValue) ?? 8;
  const finalizedRoundIds = state.rounds.filter(r => r.status === 'finalized').map(r => r.id);
  const stats = new Map();

  state.players.forEach(p => {
    stats.set(p.id, {
      player: p,
      wins: 0, losses: 0, draws: 0, byes: 0,
      matchPoints: 0,
      cubesWon: 0, cubesLost: 0,
      opponents: [],
      matchWinPct: 0, omwp: 0, oomwp: 0
    });
  });

  state.pairings.forEach(pair => {
    if (!finalizedRoundIds.includes(pair.round_id)) return;
    if (pair.is_bye) {
      const s = stats.get(pair.player1_id);
      if (s) { s.wins++; s.byes++; s.matchPoints += 3; s.cubesWon += byeCubes; }
      return;
    }
    const r = pair.result || {};
    if (!r.winner) return;
    const p1 = stats.get(pair.player1_id);
    const p2 = stats.get(pair.player2_id);
    if (!p1 || !p2) return;
    p1.opponents.push(pair.player2_id);
    p2.opponents.push(pair.player1_id);
    const c1 = r.cubes1 || 0;
    const c2 = r.cubes2 || 0;
    p1.cubesWon += c1; p1.cubesLost += c2;
    p2.cubesWon += c2; p2.cubesLost += c1;
    if (r.winner === 'player1') { p1.wins++; p1.matchPoints += 3; p2.losses++; }
    else if (r.winner === 'player2') { p2.wins++; p2.matchPoints += 3; p1.losses++; }
    else if (r.winner === 'draw') { p1.draws++; p2.draws++; p1.matchPoints += 1; p2.matchPoints += 1; }
  });

  stats.forEach(s => {
    const total = s.wins + s.losses + s.draws;
    s.matchWinPct = total === 0 ? 0 : Math.max(1/3, (s.wins + 0.5 * s.draws) / total);
  });
  stats.forEach(s => {
    if (s.opponents.length === 0) return;
    let sum = 0;
    s.opponents.forEach(o => { const os = stats.get(o); if (os) sum += os.matchWinPct; });
    s.omwp = sum / s.opponents.length;
  });
  stats.forEach(s => {
    if (s.opponents.length === 0) return;
    let sum = 0;
    s.opponents.forEach(o => { const os = stats.get(o); if (os) sum += os.omwp; });
    s.oomwp = sum / s.opponents.length;
  });

  const arr = Array.from(stats.values());
  arr.sort((a, b) => {
    if (b.matchPoints !== a.matchPoints) return b.matchPoints - a.matchPoints;
    const ad = a.cubesWon - a.cubesLost;
    const bd = b.cubesWon - b.cubesLost;
    if (bd !== ad) return bd - ad;
    if (b.omwp !== a.omwp) return b.omwp - a.omwp;
    if (b.oomwp !== a.oomwp) return b.oomwp - a.oomwp;
    return 0;
  });
  return arr.map((s, i) => ({ ...s, rank: i + 1, cubeDiff: s.cubesWon - s.cubesLost }));
}

function parseRoute() {
  const url = new URL(window.location.href);
  const view = url.searchParams.get('view');
  const tid = url.searchParams.get('t');
  if (view === 'public' && tid) {
    state.mode = 'spectator';
    state.activeTournamentId = tid;
  } else if (view === 'register' && tid) {
    state.mode = 'register';
    state.activeTournamentId = tid;
  } else {
    state.mode = 'to';
  }
}

function buildSpectatorUrl(tournamentId) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?view=public&t=${tournamentId}`;
}

function buildRegistrationUrl(tournamentId) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?view=register&t=${tournamentId}`;
}
