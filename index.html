// AUTH (PIN)
// ============================================================
function renderPinGate() {
  const hasPin = !!localStorage.getItem(LS_KEYS.PIN_HASH);
  const title = hasPin ? 'Enter TO PIN' : 'Set a TO PIN';
  const sub = hasPin
    ? 'This PIN protects the organizer dashboard on this device.'
    : 'Choose a PIN (4+ characters). It will be hashed and stored locally on this device.';

  el('app').innerHTML = `
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
      <div class="card" style="max-width: 440px; width: 100%;">
        <div style="text-align:center; margin-bottom:24px;">
          <div class="brand-title" style="justify-content:center; font-size:2.4rem;">
            SNAP<span class="accent">TO</span>
          </div>
          <div class="brand-sub">Tournament Organizer</div>
        </div>
        <h3 style="margin-bottom:6px;">${esc(title)}</h3>
        <p class="muted" style="font-size:0.88rem; margin-bottom:16px;">${esc(sub)}</p>
        <div class="field">
          <label>PIN</label>
          <input type="password" id="pin-input" placeholder="\u2022\u2022\u2022\u2022" autocomplete="off" autofocus />
        </div>
        ${!hasPin ? `
        <div class="field" style="margin-top:12px;">
          <label>Confirm PIN</label>
          <input type="password" id="pin-confirm" placeholder="\u2022\u2022\u2022\u2022" autocomplete="off" />
        </div>` : ''}
        <button class="btn btn-primary" id="pin-submit" style="width:100%; margin-top:16px;">
          ${hasPin ? 'Unlock' : 'Set PIN'}
        </button>
        ${hasPin ? `
        <button class="btn btn-ghost btn-sm" id="pin-reset" style="width:100%; margin-top:8px;">
          Forgot PIN \u2014 reset (clears local PIN only)
        </button>` : ''}
      </div>
    </div>
  `;

  el('pin-submit').addEventListener('click', async () => {
    const pin = el('pin-input').value.trim();
    if (pin.length < 4) return toast('PIN must be 4+ characters', 'error');
    const hash = await sha256(pin);
    if (hasPin) {
      const stored = localStorage.getItem(LS_KEYS.PIN_HASH);
      if (hash !== stored) return toast('Incorrect PIN', 'error');
      sessionStorage.setItem(LS_KEYS.AUTHED, '1');
      state.authed = true;
      boot();
    } else {
      const confirmPin = el('pin-confirm').value.trim();
      if (pin !== confirmPin) return toast('PINs do not match', 'error');
      localStorage.setItem(LS_KEYS.PIN_HASH, hash);
      sessionStorage.setItem(LS_KEYS.AUTHED, '1');
      state.authed = true;
      toast('PIN set', 'success');
      boot();
    }
  });

  if (hasPin) {
    el('pin-reset').addEventListener('click', () => {
      confirm('Reset local PIN? This only clears the PIN on this device \u2014 tournament data in Supabase is unchanged.', () => {
        localStorage.removeItem(LS_KEYS.PIN_HASH);
        renderPinGate();
      }, { danger: true, okLabel: 'Reset PIN' });
    });
  }
  el('pin-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') el('pin-submit').click();
  });
}

        </p>
        <button class="btn btn-sm" id="copy-sql" style="margin-top:8px;">Copy SQL</button>

        <div class="field" style="margin-top:12px;">
          <label>Supabase URL</label>

        </div>

        </div>

        </p>

        <button class="btn btn-primary" id="connect" style="width:100%; margin-top:20px;">Connect</button>
      </div>
    </div>
  `;
  el('copy-sql').addEventListener('click', () => copyToClipboard(SQL_MIGRATION));
  el('connect').addEventListener('click', async () => {
    const url = el('sb-url').value.trim();
    const key = el('sb-key').value.trim();
    if (!url || !key) return toast('Both fields required', 'error');
    localStorage.setItem(LS_KEYS.SUPABASE_URL, url);
    localStorage.setItem(LS_KEYS.SUPABASE_KEY, key);
    if (!initSupabase()) return toast('Connection failed', 'error');
    const check = await checkConnection();
    if (!check.ok) {
      toast('Connected, but schema check failed \u2014 did you run the SQL? (' + check.error + ')', 'error');
      return;
    }
    toast('Connected to Supabase', 'success');
    boot();
  });
}

// ============================================================
// WHAT'S NEXT (Dashboard state-aware guide)
// ============================================================
function computeWhatsNext() {
  const t = state.activeTournament;
  if (!t) return null;

  const activeRound = state.rounds.find(r => r.status === 'active');
  const allRoundsFinalized = state.rounds.length > 0 && state.rounds.every(r => r.status === 'finalized');
  const maxRounds = t.config?.rounds || 4;
  const topCut = t.config?.topCut || 0;

  // Detect bracket state
  const elimRounds = state.rounds.filter(r =>
    state.pairings.some(p => p.round_id === r.id && p.bracket_stage)
  );
  const inBracket = elimRounds.length > 0;
  const bracketComplete = inBracket && (() => {
    const last = elimRounds[elimRounds.length - 1];
    const lastPairings = state.pairings.filter(p => p.round_id === last.id);
    return lastPairings.length === 1 && lastPairings[0].result?.winner;
  })();

  if (t.status === 'complete' || bracketComplete) {
    return {
      eyebrow: 'Wrapped',
      title: 'Tournament complete',
      desc: 'Export results for records, reveal decks, or mark the tournament complete in Setup.',
      actions: [
        { label: 'Export Results', action: () => exportJson() },
        { label: 'Standings CSV', action: () => exportStandingsCsv() },
      ],
    };
  }

  if (t.status === 'setup') {
    if (state.players.length === 0) {
      return {
        eyebrow: 'Next step',
        title: 'Add players',
        desc: 'No one is in the tournament yet. Add players manually or open self-registration so they can drop their own deck codes.',
        actions: [
          { label: 'Add Players', action: () => { state.route = 'players'; renderShell(); renderRoute(); } },
          { label: 'Open Registration', action: () => { state.route = 'setup'; renderShell(); renderRoute(); }, ghost: true },
        ],
      };
    }
    const unchecked = state.players.filter(p => !p.checked_in && !p.dropped).length;
    const checkedIn = state.players.filter(p => p.checked_in && !p.dropped).length;
    if (unchecked > 0 && checkedIn < 2) {
      return {
        eyebrow: 'Next step',
        title: `Check in players (${unchecked} waiting)`,
        desc: 'Mark players as checked in at the event. Unchecked players will be auto-dropped when you lock registration.',
        actions: [
          { label: 'Open Check-In', action: () => { state.route = 'players'; renderShell(); renderRoute(); } },
        ],
      };
    }
    return {
      eyebrow: 'Ready to go',
      title: 'Lock registration and start',
      desc: `${checkedIn} player(s) checked in. Locking will drop any unchecked players and auto-generate Round 1 pairings.`,
      actions: [
        { label: 'Go to Setup', action: () => { state.route = 'setup'; renderShell(); renderRoute(); } },
      ],
    };
  }

  if (t.status === 'running') {
    if (activeRound) {
      const rpairs = state.pairings.filter(p => p.round_id === activeRound.id);
      const pending = rpairs.filter(p => !p.result?.winner && !p.is_bye).length;
      const inBracketNow = rpairs.some(p => p.bracket_stage);
      if (pending > 0) {
        return {
          eyebrow: inBracketNow ? 'Bracket in progress' : `Round ${activeRound.round_number} in progress`,
          title: `Report ${pending} pending match${pending === 1 ? '' : 'es'}`,
          desc: 'Tap Report on each pairing as results come in. Results stream live to the spectator page.',
          actions: [
            { label: 'Open Pairings', action: () => { state.route = 'pairings'; renderShell(); renderRoute(); } },
          ],
        };
      }
      // All in \u2014 finalize
      return {
        eyebrow: inBracketNow ? 'Bracket ready' : `Round ${activeRound.round_number} complete`,
        title: inBracketNow ? 'Advance the bracket' : 'Finalize and advance',
        desc: inBracketNow
          ? 'All bracket matches in this round are reported. Finalize this round and generate the next bracket round.'
          : 'All matches are reported. Finalize this round to lock results and generate the next pairings.',
        actions: [
          { label: inBracketNow ? 'Advance Bracket' : 'Finalize & Advance', action: () => { state.route = 'pairings'; renderShell(); renderRoute(); } },
        ],
      };
    }

    // No active round. Either Swiss is done (start bracket), or generate next.
    if (allRoundsFinalized && state.rounds.length >= maxRounds && topCut > 0 && !inBracket) {
      return {
        eyebrow: 'Swiss complete',
        title: `Start Top ${topCut} bracket`,
        desc: `All ${maxRounds} Swiss rounds are finalized. Begin the single-elimination top cut from current standings.`,
        actions: [
          { label: `Start Top ${topCut}`, action: () => { state.route = 'bracket'; renderShell(); renderRoute(); } },
          { label: 'View Standings', ghost: true, action: () => { state.route = 'standings'; renderShell(); renderRoute(); } },
        ],
      };
    }

    return {
      eyebrow: 'Ready',
      title: 'Generate next round',
      desc: allRoundsFinalized && state.rounds.length < maxRounds
        ? `Round ${state.rounds.length} is finalized. Generate Round ${state.rounds.length + 1}.`
        : 'Generate the next set of pairings based on current standings.',
      actions: [
        { label: 'Go to Pairings', action: () => { state.route = 'pairings'; renderShell(); renderRoute(); } },
      ],
    };
  }

  return null;
}

function renderWhatsNextCard() {
  const next = computeWhatsNext();
  if (!next) return '';
  const id = 'whatsnext-' + Math.random().toString(36).slice(2, 8);
  const html = `
    <div class="card card-next" id="${id}" style="padding:20px 22px 20px 28px;">
      <div class="next-eyebrow">${esc(next.eyebrow)}</div>
      <h3>${esc(next.title)}</h3>
      <p class="desc">${esc(next.desc)}</p>
      <div class="next-actions">
        ${next.actions.map((a, i) => `
          <button class="btn ${a.ghost ? 'btn-ghost' : 'btn-gold'}" data-next-action="${i}">${esc(a.label)}</button>
        `).join('')}
      </div>
    </div>
  `;
  setTimeout(() => {
    const card = el(id);
    if (!card) return;
    card.querySelectorAll('[data-next-action]').forEach((b, i) => {
      b.addEventListener('click', () => next.actions[i].action());
    });
  }, 0);
  return html;
}

          <select id="ts-format">
            <option value="swiss" ${t.format === 'swiss' ? 'selected' : ''}>Swiss</option>
            <option value="single_elim" ${t.format === 'single_elim' ? 'selected' : ''}>Single Elim</option>
          </select>
        </div>
        <div class="field">
          <label>Match Mode <span class="help-hint" title="Normal: 1 game, stake of 1/2/4/8 cubes. Conquest: multi-game battle, cube totals can exceed 10.">?</span></label>
          <select id="ts-match-mode">
            <option value="normal" ${matchMode === 'normal' ? 'selected' : ''}>Normal (Ladder)</option>
            <option value="conquest" ${matchMode === 'conquest' ? 'selected' : ''}>Conquest (Battle Mode)</option>
          </select>
        </div>
        <div class="field"><label>Rounds</label><input type="number" id="ts-rounds" value="${c.rounds || 4}" min="1" max="20" /></div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Top Cut</label>
          <select id="ts-topcut">
            <option value="0" ${!c.topCut ? 'selected' : ''}>None</option>
            <option value="2" ${c.topCut === 2 ? 'selected' : ''}>Top 2</option>
            <option value="4" ${c.topCut === 4 ? 'selected' : ''}>Top 4</option>
            <option value="8" ${c.topCut === 8 ? 'selected' : ''}>Top 8</option>
            <option value="16" ${c.topCut === 16 ? 'selected' : ''}>Top 16</option>
          </select>
        </div>
        <div class="field"><label>Bye Cube Value</label><input type="number" id="ts-bye" value="${c.byeCubeValue ?? (matchMode === 'conquest' ? 10 : 8)}" min="0" /></div>
      </div>
      <div class="row mt-md" style="flex-wrap:wrap;">
        <button class="btn btn-primary" id="ts-save">Save Changes</button>
        ${t.status === 'setup' ? `
          <button class="btn btn-gold" id="ts-lock">Lock Registration & Start</button>
        ` : ''}
        ${t.status === 'running' ? `
          <button class="btn" id="ts-complete">Mark Complete</button>
        ` : ''}
      </div>
    </div>

    ${t.status === 'setup' ? `
      <div class="card">
        <div class="card-header"><div class="card-title">Seeding</div></div>
        <p class="muted" style="font-size:0.88rem; margin-bottom:12px;">
          Assign seeds manually in the Players tab, or randomize here before starting.
        </p>
        <button class="btn" id="ts-randomize">Randomize Seeds</button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Player Self-Registration</div>
          <span class="badge ${c.registrationOpen ? 'green' : 'muted'}">${c.registrationOpen ? 'Open' : 'Closed'}</span>
        </div>
        <p class="muted" style="font-size:0.88rem; margin-bottom:12px;">
          When open, players can register themselves by pasting a deck code at a public URL.
          ${state.cards.length === 0 ? '<br><strong style="color:var(--gold);">Tip:</strong> Sync the Card Library first so players see deck art during registration.' : ''}
        </p>
        ${c.registrationOpen ? `
          <div class="copy-link" style="margin-bottom:12px;">
            <span class="url">${esc(buildRegistrationUrl(t.id))}</span>
            <button class="btn btn-sm" id="copy-reg-link">Copy</button>
          </div>
        ` : ''}
        <div class="row">
          <button class="btn ${c.registrationOpen ? 'btn-danger' : 'btn-primary'}" id="ts-toggle-reg">
            ${c.registrationOpen ? 'Close Registration' : 'Open Registration'}
          </button>
        </div>
      </div>
    ` : ''}

    <div class="card">
      <div class="card-header"><div class="card-title">Rounds</div></div>
      ${state.rounds.length === 0 ? `
        <p class="muted">No rounds yet. Lock registration and start the tournament to generate round 1.</p>
      ` : `
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Status</th><th>Pairings</th><th>Finalized</th><th></th></tr></thead>
          <tbody>
            ${state.rounds.map(r => {
              const ps = state.pairings.filter(p => p.round_id === r.id);
              return `
                <tr>
                  <td><strong>R${r.round_number}</strong></td>
                  <td><span class="badge ${r.status === 'active' ? 'gold' : 'green'}">${esc(r.status)}</span></td>
                  <td>${ps.length}</td>
                  <td class="muted">${r.finalized_at ? new Date(r.finalized_at).toLocaleString() : '\u2014'}</td>
                  <td>
                    ${r.status === 'finalized' ? `<button class="btn btn-xs" data-reopen="${r.id}">Reopen</button>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table></div>
      `}
    </div>
  `;

  el('ts-save').addEventListener('click', async () => {
    const patch = {
      name: el('ts-name').value.trim(),
      date: el('ts-date').value || null,
      format: el('ts-format').value,
      config: {
        ...c,
        rounds: parseInt(el('ts-rounds').value) || 4,
        topCut: parseInt(el('ts-topcut').value) || 0,
        byeCubeValue: parseInt(el('ts-bye').value) || 8,
        matchMode: el('ts-match-mode').value || 'normal',
      }
    };
    if (await updateTournament(t.id, patch)) {
      toast('Saved', 'success');
      await loadTournamentData(t.id);
      renderRoute();
    }
  });

  el('ts-lock')?.addEventListener('click', () => {
    const uncheckedCount = state.players.filter(p => !p.checked_in).length;
    const msg = uncheckedCount
      ? `Lock registration? ${uncheckedCount} unchecked player(s) will be auto-dropped. Round 1 pairings will be generated.`
      : 'Lock registration and generate Round 1 pairings?';
    confirm(msg, async () => {
      for (const p of state.players) {
        if (!p.checked_in) await updatePlayer(p.id, { dropped: true });
      }
      const newConfig = { ...(t.config || {}), registrationOpen: false };
      await updateTournament(t.id, { status: 'running', config: newConfig });
      await generateNextRound();
      await loadTournamentData(t.id);
      state.route = 'pairings';
      renderShell();
      renderRoute();
    });
  });

  el('ts-complete')?.addEventListener('click', () => {
    confirm('Mark tournament as complete?', async () => {
      await updateTournament(t.id, { status: 'complete' });
      await loadTournamentData(t.id);
      renderRoute();
    });
  });

  el('ts-randomize')?.addEventListener('click', async () => {
    const shuffled = [...state.players].sort(() => Math.random() - 0.5);
    for (let i = 0; i < shuffled.length; i++) {
      await updatePlayer(shuffled[i].id, { seed: i + 1 });
    }
    toast('Seeds randomized', 'success');
    await loadTournamentData(t.id);
    renderRoute();
  });

  el('ts-toggle-reg')?.addEventListener('click', async () => {
    const newConfig = { ...(t.config || {}), registrationOpen: !c.registrationOpen };
    await updateTournament(t.id, { config: newConfig });
    toast(newConfig.registrationOpen ? 'Registration open' : 'Registration closed', 'success');
    await loadTournamentData(t.id);
    renderRoute();
  });

  el('copy-reg-link')?.addEventListener('click', () => copyToClipboard(buildRegistrationUrl(t.id)));

  document.querySelectorAll('[data-reopen]').forEach(b => {
    b.addEventListener('click', () => {
      confirm('Reopen this round? Subsequent rounds will not auto-clear \u2014 be careful.', async () => {
        await reopenRound(b.dataset.reopen);
        await loadTournamentData(t.id);
        renderRoute();
      });
    });
  });

  attachTournamentPicker();
}


// ============================================================
// UI: PLAYERS
// ============================================================
function renderPlayers(main) {
  const t = state.activeTournament;
  if (!t) return renderNoTournament(main);

  const filter = (state.checkinFilter || '').toLowerCase();
  const filtered = state.players.filter(p => {
    if (!filter) return true;
    return (p.name || '').toLowerCase().includes(filter)
        || (p.alias || '').toLowerCase().includes(filter);
  });

  const totalActive = state.players.filter(p => !p.dropped).length;
  const checkedIn = state.players.filter(p => p.checked_in && !p.dropped).length;
  const waiting = state.players.filter(p => !p.checked_in && !p.dropped).length;
  const dropped = state.players.filter(p => p.dropped).length;

  main.innerHTML += `
    <div class="main-header">
      <div>
        <h1>Players</h1>
        <div class="muted">${state.players.length} registered \u00b7 ${checkedIn} checked in \u00b7 ${dropped} dropped</div>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="add-player">+ Add Player</button>
      </div>
    </div>

    ${state.players.length === 0 ? `
      <div class="card">
        <div class="empty-state">
          <h3>No players yet</h3>
          <p>Add players manually, or enable self-registration in Tournament Setup so players can add themselves.</p>
          <button class="btn btn-primary mt-md" id="add-player-2">+ Add First Player</button>
        </div>
      </div>
    ` : `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Check-In</div>
          <span class="muted" style="font-size:0.82rem;">Tap a tile to toggle check-in.</span>
        </div>
        <div class="checkin-toolbar">
          <input type="text" id="checkin-search" placeholder="Search players..." value="${esc(state.checkinFilter || '')}" />
          <button class="btn btn-sm" id="checkin-all">Check In All</button>
          <button class="btn btn-sm btn-ghost" id="checkin-none">Uncheck All</button>
        </div>
        <div class="checkin-summary">
          <span><span class="dot jade"></span>${checkedIn} in</span>
          <span><span class="dot gold"></span>${waiting} waiting</span>
          <span><span class="dot dim"></span>${dropped} dropped</span>
          <span style="margin-left:auto;">${totalActive} active</span>
        </div>

        <div class="checkin-grid">
          ${filtered.map(p => {
            const state_ = p.dropped ? 'dropped' : (p.checked_in ? 'in' : 'out');
            return `
              <div class="checkin-tile ${state_}" data-player="${p.id}" ${p.dropped ? 'data-locked="1"' : ''} tabindex="0" role="button" aria-pressed="${p.checked_in ? 'true' : 'false'}">
                <span class="check-icon"></span>
                <div class="tile-body">
                  ${renderAvatar(p, 'md')}
                  <div class="tile-main">
                    <div class="tile-name">${esc(p.name)}</div>
                    <div class="tile-sub">
                      ${p.alias ? `<span>@${esc(p.alias)}</span>` : ''}
                      ${p.seed ? `<span>Seed ${p.seed}</span>` : ''}
                      ${p.dropped ? `<span style="color:var(--ember-hi);">dropped</span>` : ''}
                    </div>
                  </div>
                </div>
                <div class="tile-actions">
                  <button class="btn btn-xs btn-ghost" data-edit="${p.id}" title="Edit">\u270E</button>
                  ${!p.dropped
                    ? `<button class="btn btn-xs btn-ghost" data-drop="${p.id}" title="Drop">\u2013</button>`
                    : `<button class="btn btn-xs btn-ghost" data-undrop="${p.id}" title="Undrop">\u21BA</button>`}
                  <button class="btn btn-xs btn-ghost" data-remove="${p.id}" title="Remove">\u00D7</button>
                </div>
              </div>
            `;
          }).join('')}
          ${filtered.length === 0 ? `<div class="muted" style="grid-column: 1 / -1; text-align:center; padding: 28px 12px;">No players match "${esc(filter)}".</div>` : ''}
        </div>
      </div>
    `}
  `;

  // Search wiring — optimistic, no rerender of whole page
  const search = el('checkin-search');
  if (search) {
    search.addEventListener('input', (e) => {
      state.checkinFilter = e.target.value;
      // Local filter only
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.checkin-tile').forEach(tile => {
        const pid = tile.dataset.player;
        const p = state.players.find(x => x.id === pid);
        if (!p) return;
        const hit = !q || (p.name || '').toLowerCase().includes(q) || (p.alias || '').toLowerCase().includes(q);
        tile.style.display = hit ? '' : 'none';
      });
    });
  }

  el('checkin-all')?.addEventListener('click', async () => {
    for (const p of state.players) {
      if (!p.dropped && !p.checked_in) {
        await updatePlayer(p.id, { checked_in: true });
      }
    }
    await loadTournamentData(t.id);
    renderRoute();
  });

  el('checkin-none')?.addEventListener('click', async () => {
    confirm('Uncheck all players?', async () => {
      for (const p of state.players) {
        if (!p.dropped && p.checked_in) {
          await updatePlayer(p.id, { checked_in: false });
        }
      }
      await loadTournamentData(t.id);
      renderRoute();
    });
  });

  // Tile tap toggles check-in (unless dropped)
  document.querySelectorAll('.checkin-tile').forEach(tile => {
    tile.addEventListener('click', async (e) => {
      // Ignore clicks that started on tile-action buttons
      if (e.target.closest('.tile-actions')) return;
      if (tile.dataset.locked) return;
      const pid = tile.dataset.player;
      const p = state.players.find(x => x.id === pid);
      if (!p) return;
      const next = !p.checked_in;
      // Optimistic UI
      tile.classList.remove('in', 'out');
      tile.classList.add(next ? 'in' : 'out');
      tile.setAttribute('aria-pressed', next ? 'true' : 'false');
      p.checked_in = next;
      await updatePlayer(pid, { checked_in: next });
      // Update summary line without full rerender
      const checkedIn2 = state.players.filter(x => x.checked_in && !x.dropped).length;
      const waiting2 = state.players.filter(x => !x.checked_in && !x.dropped).length;
      const sum = document.querySelector('.checkin-summary');
      if (sum) {
        sum.children[0].innerHTML = `<span class="dot jade"></span>${checkedIn2} in`;
        sum.children[1].innerHTML = `<span class="dot gold"></span>${waiting2} waiting`;
      }
    });
    tile.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        tile.click();
      }
    });
  });

  document.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = state.players.find(x => x.id === b.dataset.edit);
      openEditPlayerModal(p);
    });
  });

  document.querySelectorAll('[data-drop]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = state.players.find(x => x.id === b.dataset.drop);
      confirm(`Drop ${p.name}? They'll no longer be paired.`, async () => {
        await updatePlayer(b.dataset.drop, { dropped: true });
        await loadTournamentData(t.id);
        renderRoute();
      });
    });
  });

  document.querySelectorAll('[data-undrop]').forEach(b => {
    b.addEventListener('click', async (e) => {
      e.stopPropagation();
      await updatePlayer(b.dataset.undrop, { dropped: false });
      await loadTournamentData(t.id);
      renderRoute();
    });
  });

  document.querySelectorAll('[data-remove]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = state.players.find(x => x.id === b.dataset.remove);
      confirm(`Remove ${p.name} entirely? This deletes their deck registration too.`, async () => {
        await removePlayer(b.dataset.remove);
        await loadTournamentData(t.id);
        renderRoute();
      }, { danger: true, okLabel: 'Remove' });
    });
  });

  el('add-player')?.addEventListener('click', () => openEditPlayerModal(null));
  el('add-player-2')?.addEventListener('click', () => openEditPlayerModal(null));

  attachTournamentPicker();
}

function openEditPlayerModal(player) {
  const isEdit = !!player;
  const currentAvatar = player?.stats?.avatar || null;
  let pickedAvatar = currentAvatar;

  openModal(`
    <h2>${isEdit ? 'Edit Player' : 'Add Player'}</h2>
    <div class="form-row">
      <div class="field"><label>Name</label><input type="text" id="p-name" value="${esc(player?.name || '')}" placeholder="Player name" /></div>
      <div class="field"><label>Alias / Tag (optional)</label><input type="text" id="p-alias" value="${esc(player?.alias || '')}" placeholder="@handle" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label>Seed</label><input type="number" id="p-seed" value="${player?.seed || ''}" min="1" /></div>
    </div>

    <h3 style="margin-top:14px; margin-bottom:10px; font-size:1rem;">Avatar</h3>
    <div id="p-avatar-picker"></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" id="p-save">${isEdit ? 'Save' : 'Add'}</button>
    </div>
  `, (backdrop) => {
    const pickerEl = backdrop.querySelector('#p-avatar-picker');
    mountAvatarPicker(pickerEl, {
      initial: currentAvatar,
      onSelect: (a) => { pickedAvatar = a; },
    });

    backdrop.querySelector('#p-save').addEventListener('click', async () => {
      const name = backdrop.querySelector('#p-name').value.trim();
      if (!name) return toast('Name required', 'error');
      const alias = backdrop.querySelector('#p-alias').value.trim() || null;
      const seedRaw = backdrop.querySelector('#p-seed').value;
      const seed = seedRaw ? parseInt(seedRaw) : null;

      const existingStats = player?.stats || {};
      const stats = { ...existingStats };
      if (pickedAvatar) stats.avatar = pickedAvatar;
      else delete stats.avatar;

      if (isEdit) {
        const ok = await updatePlayer(player.id, { name, alias, seed, stats });
        if (ok) {
          toast('Saved', 'success');
          backdrop.remove();
          await loadTournamentData(state.activeTournamentId);
          renderRoute();
        }
      } else {
        const p = await addPlayer(state.activeTournamentId, { name, alias, seed });
        if (p) {
          if (pickedAvatar) await updatePlayer(p.id, { stats });
          toast('Added', 'success');
          backdrop.remove();
          await loadTournamentData(state.activeTournamentId);
          renderRoute();
        }
      }
    });
  });
}

function renderNoTournament(main) {
  main.innerHTML += `
    <div class="card">
      <div class="empty-state">
        <h3>No tournament selected</h3>
        <p>Pick one from the dropdown above, or create a new one from the Dashboard.</p>
        <button class="btn btn-primary mt-md" id="goto-dash">Back to Dashboard</button>
      </div>
    </div>
  `;
  el('goto-dash')?.addEventListener('click', () => {
    state.route = 'dashboard';
    renderShell();
    renderRoute();
  });
  attachTournamentPicker();
}


// ============================================================
// UI: PAIRINGS
// ============================================================
function renderPairings(main) {
  const t = state.activeTournament;
  if (!t) return renderNoTournament(main);

  const activeRound = state.rounds.find(r => r.status === 'active');
  const finalizedRounds = state.rounds.filter(r => r.status === 'finalized');

  main.innerHTML += `
    <div class="main-header">
      <div>
        <h1>Pairings</h1>
        <div class="muted">${activeRound ? `Round ${activeRound.round_number} is active` : 'No round in progress'}</div>
      </div>
      <div class="row">
        ${!activeRound ? `<button class="btn btn-primary" id="gen-next" data-loading-key="generate-round">+ Generate Next Round</button>` : ''}
      </div>
    </div>

    ${activeRound ? renderActiveRound(activeRound) : ''}

    ${finalizedRounds.length > 0 ? `
      <div class="card">
        <div class="card-header"><div class="card-title">Past Rounds</div></div>
        ${finalizedRounds.slice().reverse().map(r => `
          <details style="margin-bottom:10px;">
            <summary style="cursor:pointer; padding: 10px 0; font-weight:600;">
              Round ${r.round_number}
              <span class="badge muted" style="margin-left:8px;">${r.finalized_at ? new Date(r.finalized_at).toLocaleString() : ''}</span>
            </summary>
            <div style="padding-top:8px;">
              ${state.pairings.filter(p => p.round_id === r.id)
                .sort((a, b) => (a.table_number || 0) - (b.table_number || 0))
                .map(p => renderPairingCard(p, true, t)).join('')}
            </div>
          </details>
        `).join('')}
      </div>
    ` : ''}
  `;

  el('gen-next')?.addEventListener('click', async () => {
    await withLoading('generate-round', async () => {
      await generateNextRound();
      await loadTournamentData(t.id);
    });
    renderShell();
    renderRoute();
  });

  // Active round handlers
  if (activeRound) {
    wireActiveRoundHandlers(activeRound);
  }

  attachTournamentPicker();
}

function renderActiveRound(activeRound) {
  const t = state.activeTournament;
  const pairings = state.pairings
    .filter(p => p.round_id === activeRound.id)
    .sort((a, b) => (a.table_number || 0) - (b.table_number || 0));

  const inBracket = pairings.some(p => p.bracket_stage);
  const pending = pairings.filter(p => !p.result?.winner && !p.is_bye);
  const complete = pairings.filter(p => p.result?.winner || p.is_bye);
  const bracketStage = inBracket ? pairings[0]?.bracket_stage : null;

  const allIn = pending.length === 0;
  const pendCount = pending.length;
  const total = pairings.length;

  return `
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          ${inBracket ? `Bracket \u2014 ${esc(bracketStage || '')}` : `Round ${activeRound.round_number}`}
          <span class="badge gold" style="margin-left:8px;">${total} match${total === 1 ? '' : 'es'}</span>
        </div>
      </div>

      ${pending.length > 0 ? `
        <div class="pairings-section-label pending">
          <span>Needs Reporting</span>
          <span class="count-chip">${pending.length}</span>
        </div>
        ${pending.map(p => renderPairingCard(p, false, t)).join('')}
      ` : ''}

      ${complete.length > 0 ? `
        <div class="pairings-section-label complete">
          <span>Completed</span>
          <span class="count-chip">${complete.length}</span>
        </div>
        ${complete.map(p => renderPairingCard(p, false, t)).join('')}
      ` : ''}

      <div class="round-action-bar ${allIn ? 'all-in' : 'pending'}">
        <div class="rab-status">
          <span class="rab-pulse ${allIn ? 'done' : ''}"></span>
          <div class="rab-text">
            <strong>${allIn ? 'All results in' : `${pendCount} of ${total} pending`}</strong>
            <span class="sub">${allIn
              ? (inBracket ? 'Finalize to advance the bracket.' : 'Finalize to lock results and generate next round.')
              : 'Report remaining matches to finalize.'}</span>
          </div>
        </div>
        <div class="row" style="gap:8px;">
          ${inBracket ? `
            <button class="btn ${allIn ? 'btn-primary' : 'btn-ghost'}" id="finalize-bracket" ${allIn ? '' : 'disabled'} data-loading-key="finalize-round">
              ${allIn ? 'Finalize & Advance Bracket' : 'Finalize & Advance'}
            </button>
          ` : `
            <button class="btn ${allIn ? 'btn-primary' : 'btn-ghost'}" id="finalize-round" ${allIn ? '' : 'disabled'} data-loading-key="finalize-round">
              ${allIn ? 'Finalize & Advance' : 'Finalize Round'}
            </button>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderPairingCard(p, readOnly, t) {
  const p1 = state.players.find(x => x.id === p.player1_id);
  const p2 = state.players.find(x => x.id === p.player2_id);
  const done = !!p.result?.winner || p.is_bye;
  const classes = ['pairing'];
  if (p.is_bye) classes.push('bye');
  if (done) classes.push('complete');
  else classes.push('pending');

  if (p.is_bye) {
    return `
      <div class="${classes.join(' ')}">
        <div class="table-num">${p.table_number || ''}</div>
        <div class="pairing-players">
          <div class="pairing-player">

}

  document.querySelectorAll('[data-report]').forEach(b => {

      if (pair) openReportModal(pair);
    });
  });

  el('finalize-round')?.addEventListener('click', () => {
    confirm('Finalize this round? Results will be locked and next pairings generated.', async () => {
      await withLoading('finalize-round', async () => {
        await finalizeRound(activeRound.id);
        await generateNextRound();
        await loadTournamentData(t.id);
      });
      renderRoute();
    });
  });

  el('finalize-bracket')?.addEventListener('click', () => {
    confirm('Finalize this bracket round and advance?', async () => {
      await withLoading('finalize-round', async () => {
        await finalizeRound(activeRound.id);
        const thisPairings = state.pairings.filter(p => p.round_id === activeRound.id);
        const next = buildNextElimRound(thisPairings);
        if (next === null) {
          toast('Cannot advance: some matches missing results', 'error');
        } else if (next.length === 0) {
          toast('Bracket complete!', 'success');
          await updateTournament(t.id, { status: 'complete' });
        } else {
          const stageName = next.length === 1 ? 'Final' : next.length === 2 ? 'Semifinals' : `Top ${next.length * 2}`;
          const newRound = await createRound(t.id, activeRound.round_number + 1);
          if (newRound) await savePairings(newRound.id, next, stageName);
        }
        await loadTournamentData(t.id);
      });
      renderRoute();
    });
  });
}

/**
 * Generate the next round of pairings.
 * - If tournament is in Swiss phase and has rounds remaining, Swiss-pair.
 * - If Swiss phase is complete and topCut is set, start bracket.
 * - If in bracket, caller should use buildNextElimRound path instead.
 */
async function generateNextRound() {
  const t = state.activeTournament;
  if (!t) return;

  const maxRounds = t.config?.rounds || 4;
  const topCut = t.config?.topCut || 0;
  const nonBracketRounds = state.rounds.filter(r =>
    !state.pairings.some(p => p.round_id === r.id && p.bracket_stage)
  );
  const inBracket = state.rounds.some(r =>
    state.pairings.some(p => p.round_id === r.id && p.bracket_stage)
  );

  // If single-elim format: bracket right away
  if (t.format === 'single_elim') {
    if (state.rounds.length === 0) {
      const active = state.players.filter(p => p.checked_in && !p.dropped);
      const n = active.length;
      if (n < 2) { toast('Need at least 2 players', 'error'); return; }
      let size = 2;
      while (size * 2 <= n) size *= 2;
      const order = standardBracketOrder(size);
      const seeded = [...active].sort((a, b) => (a.seed || 999) - (b.seed || 999));
      const pairings = [];
      for (let i = 0; i < order.length; i += 2) {
        const a = seeded[order[i] - 1];
        const b = seeded[order[i + 1] - 1];
        pairings.push({ player1_id: a?.id, player2_id: b?.id || null, is_bye: !b });
      }
      const stageName = pairings.length === 1 ? 'Final' : pairings.length === 2 ? 'Semifinals' : `Top ${pairings.length * 2}`;
      const newRound = await createRound(t.id, 1);
      if (newRound) {
        await savePairings(newRound.id, pairings, stageName);
        toast(`${stageName} created`, 'success');
      }
      return;
    }
    toast('Bracket is in progress \u2014 finalize the active round to advance.', 'info');
    return;
  }

  // Swiss format
  if (nonBracketRounds.length >= maxRounds && topCut > 0 && !inBracket) {
    // Swiss done, start bracket
    const brPairings = buildTopCut(topCut);
    if (brPairings.length === 0) { toast('Top cut failed', 'error'); return; }
    const stageName = brPairings.length === 1 ? 'Final' : brPairings.length === 2 ? 'Semifinals' : `Top ${brPairings.length * 2}`;
    const newRound = await createRound(t.id, state.rounds.length + 1);
    if (newRound) {
      await savePairings(newRound.id, brPairings, stageName);
      toast(`Top cut started: ${stageName}`, 'success');
    }
    return;
  }

  if (nonBracketRounds.length >= maxRounds && !topCut) {
    toast('All Swiss rounds complete. No top cut configured.', 'info');
    await updateTournament(t.id, { status: 'complete' });
    return;
  }

  // Swiss next round
  const pairings = pairSwiss();
  if (pairings.length === 0) { toast('No pairings generated (check player check-in)', 'error'); return; }
  const newRound = await createRound(t.id, state.rounds.length + 1);
  if (newRound) {
    await savePairings(newRound.id, pairings);
    toast(`Round ${newRound.round_number} generated`, 'success');
  }
}

function openReportModal(pair) {
  const t = state.activeTournament;
  const matchMode = t.config?.matchMode || 'normal';
  const p1 = state.players.find(x => x.id === pair.player1_id);
  const p2 = state.players.find(x => x.id === pair.player2_id);

function exportStandingsCsv() {
  const t = state.activeTournament;
  if (!t) return;
  const rows = [['Rank', 'Player', 'Alias', 'W', 'L', 'D', 'Byes', 'MatchPoints', 'CubesWon', 'CubesLost', 'CubeDiff', 'OMWP', 'OOMWP', 'Dropped']];
  computeStandings().forEach(s => {
    rows.push([
      s.rank, s.player.name, s.player.alias || '',
      s.wins, s.losses, s.draws, s.byes,
      s.matchPoints, s.cubesWon, s.cubesLost, s.cubeDiff,
      s.omwp.toFixed(4), s.oomwp.toFixed(4),
      s.player.dropped ? 'yes' : 'no'
    ]);
  });
  const csv = rows.map(r => r.map(c => {
    const s = String(c);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t.name.replace(/\s+/g, '_')}_standings.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportJson() {
  const t = state.activeTournament;
  if (!t) return;
  const payload = {
    tournament: t,
    players: state.players,
    rounds: state.rounds,
    pairings: state.pairings,
    decks: state.decks,
    standings: computeStandings().map(s => ({
      rank: s.rank,
      playerId: s.player.id,
      playerName: s.player.name,
      matchPoints: s.matchPoints,
      record: { wins: s.wins, losses: s.losses, draws: s.draws, byes: s.byes },
      cubesWon: s.cubesWon,
      cubesLost: s.cubesLost,
      cubeDiff: s.cubeDiff,
      omwp: s.omwp,
      oomwp: s.oomwp,
    })),
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t.name.replace(/\s+/g, '_')}_export.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderBracket(main) {
  const t = state.activeTournament;
  if (!t) return renderNoTournament(main);

  // Find all bracket rounds
  const bracketRounds = state.rounds.filter(r =>
    state.pairings.some(p => p.round_id === r.id && p.bracket_stage)
  ).sort((a, b) => a.round_number - b.round_number);

  const topCut = t.config?.topCut || 0;

  main.innerHTML += `
    <div class="main-header">
      <div>
        <h1>Bracket</h1>
        <div class="muted">${bracketRounds.length === 0 ? 'Not started' : `${bracketRounds.length} bracket round(s)`}</div>
      </div>
      <div class="row">
        ${bracketRounds.length === 0 && topCut > 0 ? `
          <button class="btn btn-primary" id="start-bracket" data-loading-key="generate-round">Start Top ${topCut} Bracket</button>
        ` : ''}
      </div>
    </div>

    ${bracketRounds.length === 0 ? `
      <div class="card">
        <div class="empty-state">
          <h3>No bracket yet</h3>
          <p>
            ${topCut > 0
              ? `When all Swiss rounds are complete, start the Top ${topCut} cut from current standings.`
              : 'Top cut is not configured for this tournament. Go to Tournament Setup to enable it.'}
          </p>
        </div>
      </div>
    ` : `
      <div class="card">
        <div class="bracket">
          ${bracketRounds.map(r => {
            const pairs = state.pairings.filter(p => p.round_id === r.id).sort((a, b) => (a.table_number || 0) - (b.table_number || 0));
            const stage = pairs[0]?.bracket_stage || `Round ${r.round_number}`;
            return `
              <div class="bracket-round">
                <div class="bracket-round-label">${esc(stage)}</div>
                ${pairs.map(p => renderBracketMatch(p)).join('')}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `}
  `;

  el('start-bracket')?.addEventListener('click', async () => {
    await withLoading('generate-round', async () => {
      await generateNextRound();
      await loadTournamentData(t.id);
    });
    renderRoute();
  });

  attachTournamentPicker();
}

function renderBracketMatch(p) {
  const p1 = state.players.find(x => x.id === p.player1_id);
  const p2 = state.players.find(x => x.id === p.player2_id);
  const done = !!p.result?.winner || p.is_bye;
  const w = p.result?.winner;

  return `
    <div class="bracket-match ${done ? 'complete' : ''}">
      <div class="bracket-slot ${w === 'player1' || p.is_bye ? 'winner' : ''} ${!p1 ? 'empty' : ''}">
        <span>${p1 ? esc(p1.name) : 'TBD'}</span>
        <span>${w === 'player1' ? (p.result?.cubes1 || 0) : ''}</span>
      </div>
      <div class="bracket-slot ${w === 'player2' ? 'winner' : ''} ${!p2 ? 'empty' : ''}">
        <span>${p2 ? esc(p2.name) : (p.is_bye ? 'BYE' : 'TBD')}</span>
        <span>${w === 'player2' ? (p.result?.cubes2 || 0) : ''}</span>
      </div>
    </div>
  `;
}

    const nameInput = backdrop.querySelector('#d-name');
    const preview = backdrop.querySelector('#d-preview');
    const saveBtn = backdrop.querySelector('#d-save');

    input.addEventListener('input', () => {

function renderCardLibrary(main) {
  const cards = state.cards;
  const count = cards.length;
  const lastUpdated = cards.length ? cards.reduce((latest, c) => {
    const d = c.updated_at ? new Date(c.updated_at) : null;
    return (d && (!latest || d > latest)) ? d : latest;
  }, null) : null;

  const searchTerm = state._cardLibrarySearch || '';
  const tagFilter = state._cardLibraryTag || '';
  const costFilter = state._cardLibraryCost || '';
  const abilityFilter = state._cardLibraryAbility || '';

  const qLower = searchTerm.toLowerCase();
  const filtered = cards.filter(c => {
    if (qLower) {
      const hay = (c.name + ' ' + (c.ability || '')).toLowerCase();
      if (!hay.includes(qLower)) return false;
    }
    if (costFilter !== '') {
      const wantCost = parseInt(costFilter);
      const cardCost = Math.min(6, c.cost || 0);
      if (costFilter === '6' ? cardCost < 6 : cardCost !== wantCost) return false;
    }
    if (abilityFilter) {
      if (getAbilityType(c) !== abilityFilter) return false;
    }
    if (tagFilter) {
      if (!(c.tags || []).includes(tagFilter)) return false;
    }
    return true;
  });

  const tagsForFilter = collectCardTags(cards).slice(0, 40);

  main.innerHTML += `
    <div class="main-header">
      <div>
        <h1>Card Library</h1>
        <div class="muted">
          ${count} cards
          ${lastUpdated ? ` \u00b7 last synced ${lastUpdated.toLocaleDateString()}` : ''}
          \u00b7 ${state.locations.length} locations
          \u00b7 ${state.avatars.length} avatars
        </div>
      </div>
      <div class="row">
        <button class="btn btn-gold" id="sync-all-api" data-loading-key="sync-library">Sync All (Cards + Locations + Avatars)</button>
        <button class="btn btn-ghost" id="paste-cards">Paste Cards</button>
        <button class="btn btn-ghost" id="paste-avatars">Paste Avatars</button>
      </div>
    </div>

    ${count === 0 ? `
      <div class="card">
        <div class="empty-state">
          <h3>No cards synced yet</h3>
          <p>
            Sync pulls from marvelsnapzone.com's public JSON. If your browser blocks it (CORS),
            open <a href="https://marvelsnapzone.com/getinfo/?searchtype=cards&searchcardstype=true" target="_blank">the data URL</a>,
            copy the JSON, and use "Paste Cards".
          </p>
          <div class="row" style="justify-content:center; margin-top:14px;">
            <button class="btn btn-primary" id="sync-all-api-2" data-loading-key="sync-library">Sync All</button>
            <button class="btn btn-ghost" id="paste-cards-2">Paste Cards</button>
          </div>
        </div>
      </div>
    ` : `
      <div class="card">
        <div class="library-search">
          <input type="text" id="lib-search" placeholder="Search cards..." value="${esc(searchTerm)}" />
          <select id="lib-cost">
            <option value="">All costs</option>
            ${[0, 1, 2, 3, 4, 5, 6].map(c => `<option value="${c}" ${costFilter === String(c) ? 'selected' : ''}>${c === 6 ? '6+' : c} cost</option>`).join('')}
          </select>
          <select id="lib-ability">
            <option value="">All abilities</option>
            ${['on-reveal', 'ongoing', 'end-of-turn', 'start-of-turn', 'activate', 'no-ability', 'other'].map(a => `
              <option value="${a}" ${abilityFilter === a ? 'selected' : ''}>${a}</option>
            `).join('')}
          </select>
        </div>
        ${tagsForFilter.length > 0 ? `
          <div class="filter-grid" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;">
            <button class="btn btn-xs ${!tagFilter ? 'btn-gold' : 'btn-ghost'}" data-tag="">All tags</button>
            ${tagsForFilter.map(t => `
              <button class="btn btn-xs ${tagFilter === t.tag ? 'btn-gold' : 'btn-ghost'}" data-tag="${esc(t.tag)}">${esc(t.tag)} (${t.count})</button>
            `).join('')}
          </div>
        ` : ''}
        <div class="muted" style="font-size:0.82rem; margin-bottom:10px;">Showing ${filtered.length} of ${count}</div>
        <div class="card-grid">
          ${filtered.slice(0, 360).map(c => `
            <div class="card-tile" title="${esc([c.name, c.cost != null ? 'Cost ' + c.cost : '', c.power != null ? 'Power ' + c.power : '', (c.ability || '').replace(/<[^>]*>/g, '')].filter(Boolean).join(' \u00b7 '))}">
              <img src="${esc(c.art || '')}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.opacity='0.2'" />
              ${c.cost != null ? `<div class="cost-chip">${c.cost}</div>` : ''}
              ${c.power != null ? `<div class="power-chip">${c.power}</div>` : ''}
              <div class="name-strip">${esc(c.name)}</div>
            </div>
          `).join('')}
        </div>
        ${filtered.length > 360 ? `<div class="muted center" style="margin-top:14px;">Showing first 360 results. Narrow your search to see more.</div>` : ''}
      </div>
    `}
  `;

  el('sync-all-api')?.addEventListener('click', () => syncAllFromApi());
  el('sync-all-api-2')?.addEventListener('click', () => syncAllFromApi());
  el('paste-cards')?.addEventListener('click', openPasteCardsModal);
  el('paste-cards-2')?.addEventListener('click', openPasteCardsModal);
  el('paste-avatars')?.addEventListener('click', openPasteAvatarsModal);

  const search = el('lib-search');
  if (search) {
    search.addEventListener('input', (e) => {
      state._cardLibrarySearch = e.target.value;
      renderRoute();
      setTimeout(() => {
        const s = el('lib-search');
        if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
      }, 0);
    });
  }
  el('lib-cost')?.addEventListener('change', (e) => { state._cardLibraryCost = e.target.value; renderRoute(); });
  el('lib-ability')?.addEventListener('change', (e) => { state._cardLibraryAbility = e.target.value; renderRoute(); });
  document.querySelectorAll('[data-tag]').forEach(b => {
    b.addEventListener('click', () => { state._cardLibraryTag = b.dataset.tag; renderRoute(); });
  });
}

async function syncAllFromApi() {
  await withLoading('sync-library', async () => {
    // Cards
    const cardRes = await fetchCardsFromMarvelsnapzone();
    if (cardRes.ok) {
      const recs = cardRes.cards.map(compactCardRecord).filter(c => c.carddefid);
      await upsertCards(recs);
      await loadCards();
      toast(`Synced ${recs.length} cards`, 'success');
    } else {
      toast(`Cards fetch failed: ${cardRes.error}. Use "Paste Cards".`, 'error');
    }
    // Locations
    const locRes = await fetchLocationsFromMarvelsnapzone();
    if (locRes.ok) {
      const recs = locRes.locations.map(compactLocationRecord).filter(l => l.carddefid);
      await upsertLocations(recs);
      await loadLocations();
      toast(`Synced ${recs.length} locations`, 'success');
    } else {
      toast(`Locations fetch failed: ${locRes.error}. Use Paste fallback on Locations page.`, 'error');
    }
    // Avatars
    const avRes = await fetchAvatarsFromMarvelsnapzone();
    if (avRes.ok) {
      const recs = avRes.avatars.map(compactAvatarRecord).filter(a => a.avatardefid);
      await upsertAvatars(recs);
      await loadAvatars();
      toast(`Synced ${recs.length} avatars`, 'success');
    } else {
      toast(`Avatars fetch failed: ${avRes.error}. Use "Paste Avatars".`, 'error');
    }
  });
  renderRoute();
}

async function renderRegistration() {
  const tid = state.activeTournamentId;
  const { data: t, error } = await state.supabase
    .from('tournaments').select('*').eq('id', tid).single();
  if (error || !t) {
    el('app').innerHTML = `
      <div class="reg-container">
        <div class="reg-header">
          <h1>Tournament not found</h1>
          <div class="meta">The registration link may have expired.</div>
        </div>
      </div>
    `;
    return;
  }

  if (!t.config?.registrationOpen) {
    el('app').innerHTML = `
      <div class="reg-container">
        <div class="reg-header">
          <h1>${esc(t.name)}</h1>
          <div class="meta">Registration closed</div>
        </div>
        <div class="card">
          <div class="empty-state">
            <h3>Registration is not open</h3>
            <p>Ask the organizer to open registration.</p>
          </div>
        </div>
      </div>
    `;
    return;
  }

  // Ensure we have avatars + cards for nicer UI (best-effort)
  if (state.cards.length === 0) await loadCards();
  if (state.avatars.length === 0) await loadAvatars();

  let pickedAvatar = null;
  let parsedDeck = null;

  el('app').innerHTML = `
    <div class="reg-container">
      <div class="reg-header">
        <h1>${esc(t.name)}</h1>
        <div class="meta">Player Registration</div>
      </div>
      <div class="card">
        <h3>Your Info</h3>
        <div class="form-row">
          <div class="field"><label>Name</label><input type="text" id="reg-name" placeholder="Your name" /></div>
          <div class="field"><label>Alias / Tag (optional)</label><input type="text" id="reg-alias" placeholder="@handle" /></div>
        </div>

        <h3 style="margin-top:14px; margin-bottom:10px; font-size:1rem;">Avatar</h3>
        <div id="reg-avatar-picker"></div>

        <h3 style="margin-top:20px;">Your Deck</h3>
        <p class="muted" style="font-size:0.86rem;">
          Paste your deck code below. In Marvel Snap, go to your Deck \u2192 Edit \u2192 Share \u2192 Copy. Long-format codes start with "eyJ".
        </p>
        <div class="field" style="margin-top:10px;">
          <label>Deck Code</label>
          <textarea id="reg-code" class="deck-code-input" rows="3" placeholder="eyJDYXJkcyI6W3..."></textarea>
        </div>
        <div id="reg-preview" style="margin-top:14px;"></div>

        <button class="btn btn-primary" id="reg-submit" style="margin-top:20px; width:100%;" disabled data-loading-key="register">Register</button>
      </div>
    </div>
  `;

  mountAvatarPicker(document.getElementById('reg-avatar-picker'), {
    onSelect: (a) => { pickedAvatar = a; },
  });

  const codeInput = el('reg-code');
  const preview = el('reg-preview');
  const submitBtn = el('reg-submit');

  codeInput.addEventListener('input', () => {
    const res = decodeDeckCode(codeInput.value);
    if (res.error) {
      preview.innerHTML = codeInput.value ? `<div class="muted" style="font-size:0.84rem;">${esc(res.error)}</div>` : '';
      parsedDeck = null;
      checkSubmit();
      return;
    }
    parsedDeck = res;
    preview.innerHTML = renderDeckPreview(res.cardDefIds);
    checkSubmit();
  });

  el('reg-name').addEventListener('input', checkSubmit);

  function checkSubmit() {
    const name = el('reg-name').value.trim();
    submitBtn.disabled = !(name && parsedDeck);
  }

  submitBtn.addEventListener('click', async () => {
    await withLoading('register', async () => {
      const name = el('reg-name').value.trim();
      const alias = el('reg-alias').value.trim() || null;
      if (!name || !parsedDeck) return;

      const { data: p, error } = await state.supabase
        .from('players')
        .insert({ tournament_id: tid, name, alias, seed: null, checked_in: false })
        .select().single();
      if (error) return toast('Register failed: ' + error.message, 'error');

      if (pickedAvatar) {
        await state.supabase.from('players').update({ stats: { avatar: pickedAvatar } }).eq('id', p.id);
      }
      const deckName = parsedDeck.name || null;
      await state.supabase.from('decks').insert({
        tournament_id: tid, player_id: p.id, deck_name: deckName, cards: parsedDeck.cardDefIds, revealed: false
      });

      el('app').innerHTML = `
        <div class="reg-container">
          <div class="reg-header">
            <h1>\u2713 Registered</h1>
            <div class="meta">See you at the tables</div>
          </div>
          <div class="card" style="text-align:center;">
            <h3>${esc(name)}</h3>
            <p class="muted" style="margin-top:8px;">
              You're in, with a ${parsedDeck.cardDefIds.length}-card deck${deckName ? ` "${esc(deckName)}"` : ''}.
              Check in with the organizer when you arrive.
            </p>
          </div>
        </div>
      `;
    });
  });
}

// ============================================================
// SPECTATOR VIEW
// ============================================================
function renderSpectatorShell() {
  const t = state.activeTournament;
  if (!t) {
    el('app').innerHTML = `
      <div class="reg-container">
        <div class="reg-header">
          <h1>Tournament not found</h1>
          <div class="meta">Check the link and try again</div>
        </div>
      </div>
    `;
    return;
  }
  const tabs = [
    { id: 'standings', label: 'Standings' },
    { id: 'pairings', label: 'Pairings' },
    { id: 'bracket', label: 'Bracket' },
    { id: 'decks', label: 'Decks' },
  ];
  el('app').innerHTML = `
    <div class="spectator-header">
      <div class="eyebrow muted" style="text-transform:uppercase; letter-spacing:0.22em; font-size:0.72rem; color:var(--gold);">
        <span class="live-dot"></span>Live \u00b7 ${t.date || ''}
      </div>
      <h1>${esc(t.name)}</h1>
      <div class="meta">${esc(t.format.toUpperCase())} \u00b7 ${esc((t.config?.matchMode || 'normal').toUpperCase())} \u00b7 ${esc(t.status)}</div>
      <div class="spectator-tabs">
        ${tabs.map(tab => `
          <div class="spectator-tab ${state.specRoute === tab.id ? 'active' : ''}" data-spec-route="${tab.id}">${tab.label}</div>
        `).join('')}
      </div>
    </div>
    <div class="main" id="spec-main" style="max-width: 1100px; margin: 0 auto; padding: 0 20px 80px;"></div>
  `;

  document.querySelectorAll('[data-spec-route]').forEach(b => {
    b.addEventListener('click', () => {
      state.specRoute = b.dataset.specRoute;
      renderSpectator();
    });
  });
}

function renderSpectator() {
  renderSpectatorShell();
  const main = el('spec-main');
  if (!main) return;
  switch (state.specRoute) {
    case 'standings': renderSpecStandings(main); break;
    case 'pairings': renderSpecPairings(main); break;
    case 'bracket': renderSpecBracket(main); break;
    case 'decks': renderSpecDecks(main); break;
    default: renderSpecStandings(main);
  }
}

function renderSpecStandings(main) {
  const standings = computeStandings();
  main.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Current Standings</div></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Rank</th><th>Player</th><th>Record</th><th>Pts</th><th>Cube +/-</th></tr>
          </thead>
          <tbody>
            ${standings.filter(s => !s.player.dropped).map(s => `
              <tr>
                <td class="${s.rank === 1 ? 'rank-1' : s.rank === 2 ? 'rank-2' : s.rank === 3 ? 'rank-3' : 'rank-num'}">${s.rank}</td>
                <td>${renderPlayerRow(s.player, 'sm')}</td>
                <td class="mono">${s.wins}-${s.losses}-${s.draws}${s.byes ? ` (+${s.byes})` : ''}</td>
                <td><strong>${s.matchPoints}</strong></td>
                <td><span style="color:${s.cubeDiff >= 0 ? 'var(--jade)' : 'var(--ember-hi)'};">${fmtCubeDiff(s.cubeDiff)}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderSpecPairings(main) {
  const t = state.activeTournament;
  const activeRound = state.rounds.find(r => r.status === 'active');
  const finalized = state.rounds.filter(r => r.status === 'finalized').slice().reverse();
  main.innerHTML = `
    ${activeRound ? `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Round ${activeRound.round_number} \u2014 In Progress</div>
        </div>
        ${state.pairings
          .filter(p => p.round_id === activeRound.id)
          .sort((a, b) => (a.table_number || 0) - (b.table_number || 0))
          .map(p => renderPairingCard(p, true, t)).join('')}
      </div>
    ` : `
      <div class="card"><div class="empty-state"><h3>No round in progress</h3></div></div>
    `}

    ${finalized.map(r => `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Round ${r.round_number}</div>
          <span class="badge green">Final</span>
        </div>
        ${state.pairings.filter(p => p.round_id === r.id)
          .sort((a, b) => (a.table_number || 0) - (b.table_number || 0))
          .map(p => renderPairingCard(p, true, t)).join('')}
      </div>
    `).join('')}
  `;
}

function renderSpecBracket(main) {
  const t = state.activeTournament;
  const bracketRounds = state.rounds.filter(r =>
    state.pairings.some(p => p.round_id === r.id && p.bracket_stage)
  ).sort((a, b) => a.round_number - b.round_number);

  if (bracketRounds.length === 0) {
    main.innerHTML = `<div class="card"><div class="empty-state"><h3>Bracket not started</h3></div></div>`;
    return;
  }

  main.innerHTML = `
    <div class="card">
      <div class="bracket">
        ${bracketRounds.map(r => {
          const pairs = state.pairings.filter(p => p.round_id === r.id).sort((a, b) => (a.table_number || 0) - (b.table_number || 0));
          const stage = pairs[0]?.bracket_stage || `Round ${r.round_number}`;
          return `
            <div class="bracket-round">
              <div class="bracket-round-label">${esc(stage)}</div>
              ${pairs.map(p => renderBracketMatch(p)).join('')}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderSpecDecks(main) {
  const revealedDecks = state.decks.filter(d => d.revealed);
  if (revealedDecks.length === 0) {
    main.innerHTML = `<div class="card"><div class="empty-state"><h3>Decks hidden</h3><p>Decks will be revealed by the organizer.</p></div></div>`;
    return;
  }
  main.innerHTML = `
    ${revealedDecks.map(d => {
      const p = state.players.find(x => x.id === d.player_id);
      if (!p) return '';
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${renderPlayerRow(p, 'md')}</div>
            <span class="muted" style="font-size:0.84rem;">${esc(d.deck_name || '')}</span>
          </div>
          ${renderDeckPreview(d.cards || [])}
        </div>
      `;
    }).join('')}
  `;
}

// ============================================================
// REALTIME (spectator mode)
// ============================================================
function subscribeRealtime(tournamentId) {
  if (!state.supabase || !tournamentId) return;
  if (state.realtimeChannel) {
    state.supabase.removeChannel(state.realtimeChannel);
  }
  const channel = state.supabase
    .channel(`tournament-${tournamentId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments', filter: `id=eq.${tournamentId}` }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `tournament_id=eq.${tournamentId}` }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rounds', filter: `tournament_id=eq.${tournamentId}` }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pairings' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'decks', filter: `tournament_id=eq.${tournamentId}` }, refresh)
    .subscribe();
  state.realtimeChannel = channel;

  async function refresh() {
    await loadTournamentData(tournamentId);
    if (state.mode === 'spectator') renderSpectator();
    else if (state.mode === 'to') renderRoute();
  }
}

// ============================================================
// BOOT
// ============================================================
async function boot() {
  parseRoute();

  if (state.mode === 'spectator') {
    if (!initSupabase()) {
      el('app').innerHTML = `
        <div class="reg-container">
          <div class="reg-header">
            <h1>Spectator link invalid</h1>
            <div class="meta">This app needs to be hosted with Supabase creds available</div>
          </div>
        </div>
      `;
      return;
    }
    await Promise.all([loadCards(), loadAvatars()]);
    await loadTournamentData(state.activeTournamentId);
    renderSpectator();
    subscribeRealtime(state.activeTournamentId);
    return;
  }

  if (state.mode === 'register') {
    if (!initSupabase()) {
      el('app').innerHTML = `
        <div class="reg-container">
          <div class="reg-header">
            <h1>Registration link invalid</h1>
            <div class="meta">The organizer hasn't finished setup</div>
          </div>
        </div>
      `;
      return;
    }
    await Promise.all([loadCards(), loadAvatars()]);
    await renderRegistration();
    return;
  }

  // TO mode
  if (!initSupabase()) return renderSetup();

  if (!state.authed) {
    const hasAuthed = sessionStorage.getItem(LS_KEYS.AUTHED) === '1';
    if (!hasAuthed) return renderPinGate();
    state.authed = true;
  }

  // Load data
  await Promise.all([loadTournaments(), loadCards(), loadLocations(), loadAvatars()]);

  // Pick active tournament
  const saved = localStorage.getItem(LS_KEYS.ACTIVE_TOURNAMENT);
  if (saved && state.tournaments.some(t => t.id === saved)) {
    state.activeTournamentId = saved;
  } else if (state.tournaments.length > 0) {
    state.activeTournamentId = state.tournaments[0].id;
    localStorage.setItem(LS_KEYS.ACTIVE_TOURNAMENT, state.activeTournamentId);
  }

  if (state.activeTournamentId) {
    await loadTournamentData(state.activeTournamentId);
    subscribeRealtime(state.activeTournamentId);
  }

  renderShell();
  renderRoute();
}

// Kick off
boot().catch(err => {
  console.error(err);
  toast('Boot error: ' + err.message, 'error');
});

</script>
</body>
</html>
